<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCFD; --bg-subtle:#F6F7F9; --surface:#FFFFFF;
    --text:#15171C; --text-soft:#565C68; --text-faint:#8A909C;
    --border:#E8EAEE; --border-strong:#D5D9E0;
    --accent:#7C5CF6; --accent-hover:#6D4DE6; --accent-soft:#F0ECFE;
    --shadow-sm:0 1px 2px rgba(21,23,28,.04), 0 1px 3px rgba(21,23,28,.05);
    --shadow-md:0 4px 14px rgba(21,23,28,.06), 0 2px 6px rgba(21,23,28,.04);
    --shadow-accent:0 4px 16px rgba(124,92,246,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{overflow-x:hidden;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 12% -8%, rgba(124,92,246,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    min-height:100vh;
  }

  /* ---------- Hero ---------- */
  header.hero{
    max-width:1180px;
    margin:0 auto;
    padding:54px 32px 18px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12px; font-weight:500; letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    border:1px solid #E4DCFB;
    padding:5px 11px; border-radius:999px;
    margin-bottom:18px;
  }
  .eyebrow .spark{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(124,92,246,.5);
    animation:spark 2.6s ease-out infinite;
  }
  @keyframes spark{
    0%{box-shadow:0 0 0 0 rgba(124,92,246,.45);}
    70%{box-shadow:0 0 0 7px rgba(124,92,246,0);}
    100%{box-shadow:0 0 0 0 rgba(124,92,246,0);}
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(34px,5.4vw,56px);
    letter-spacing:-.01em;
    line-height:1.04;
    color:var(--text);
  }
  .tagline{
    margin-top:12px;
    font-size:clamp(15px,1.7vw,18px);
    color:var(--text-soft);
    max-width:560px;
  }

  /* ---------- Map shell ---------- */
  .map-wrap{
    max-width:1180px;
    margin:26px auto 70px;
    padding:0 32px;
  }
  .map-canvas{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-md);
    padding:30px 26px;
    overflow:hidden;
  }
  .map-canvas::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(21,23,28,.045) 1px, transparent 0);
    background-size:22px 22px;
    pointer-events:none;
    opacity:.5;
  }

  /* ---------- Tree (horizontal) ---------- */
  .tree{
    position:relative;
    display:flex;
    align-items:center;
    gap:0;
    min-height:420px;
  }

  /* Root node */
  .root{
    position:relative;
    z-index:3;
    flex:0 0 auto;
    margin-right:54px;
  }
  .root-node{
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    background:linear-gradient(180deg,#fff, #FBFAFE);
    border:1.5px solid #E4DCFB;
    border-radius:14px;
    padding:16px 20px;
    box-shadow:var(--shadow-accent);
    min-width:178px;
  }
  .root-node .badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Fraunces',serif; font-weight:500;
    font-size:17px; color:var(--text);
  }
  .root-node .glyph{
    width:30px; height:30px; border-radius:9px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-accent);
    flex:0 0 auto;
  }
  .root-node .glyph svg{width:17px; height:17px; stroke:#fff;}
  .root-node .sub{font-size:11.5px; color:var(--text-faint); letter-spacing:.02em;}

  /* Themes column */
  .themes{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:0 0 auto;
  }

  .branch{ position:relative; display:flex; align-items:flex-start; }

  /* Theme node (clickable) */
  .theme-node{
    position:relative;
    z-index:3;
    display:flex; align-items:center; gap:11px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:12px;
    padding:11px 15px;
    cursor:pointer;
    min-width:236px;
    box-shadow:var(--shadow-sm);
    transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .theme-node:hover{ border-color:#C9BEF6; transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .theme-node:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .branch.open > .theme-node{
    border-color:#C9BEF6;
    background:linear-gradient(180deg,#fff,#FBFAFE);
  }
  .dot{
    width:11px; height:11px; border-radius:50%; flex:0 0 auto;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .theme-label{ font-size:14px; font-weight:600; color:var(--text); flex:1; letter-spacing:-.005em;}
  .count{
    font-size:11px; font-weight:600; color:var(--text-faint);
    background:var(--bg-subtle); border:1px solid var(--border);
    border-radius:999px; padding:1px 8px; min-width:24px; text-align:center;
  }
  .chev{
    width:15px; height:15px; flex:0 0 auto;
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    stroke:var(--text-faint);
  }
  .branch.open .chev{ transform:rotate(90deg); stroke:var(--accent); }

  /* Leaves panel */
  .leaves{
    position:relative;
    z-index:3;
    display:grid;
    grid-template-columns:0fr;
    transition:grid-template-columns .34s cubic-bezier(.4,0,.2,1),
               opacity .26s ease, margin-left .34s cubic-bezier(.4,0,.2,1);
    opacity:0;
    margin-left:0;
    align-self:center;
  }
  .branch.open .leaves{
    grid-template-columns:1fr;
    opacity:1;
    margin-left:46px;
  }
  .leaves-inner{
    overflow:hidden;
    min-width:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:2px;
  }

  /* Leaf node */
  .leaf{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--bg-subtle);
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 13px;
    font-size:13px; font-weight:500; color:var(--text-soft);
    white-space:nowrap;
    cursor:default;
    text-decoration:none;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease, color .16s ease;
  }
  .leaf .leaf-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--border-strong);
    flex:0 0 auto;
    transition:background .16s ease;
  }
  .leaf:hover{ border-color:#C9BEF6; color:var(--text); }
  .leaf:hover .leaf-dot{ background:var(--accent); }

  /* Live (navigable) leaf */
  .leaf.live{
    background:var(--accent-soft);
    border-color:#DCD2FB;
    color:var(--accent-hover);
    cursor:pointer;
    font-weight:600;
  }
  .leaf.live .leaf-dot{ background:var(--accent); box-shadow:0 0 0 0 rgba(124,92,246,.5); animation:spark 2.6s ease-out infinite;}
  .leaf.live:hover{ background:#fff; border-color:var(--accent); box-shadow:var(--shadow-accent); transform:translateY(-1px);}
  .leaf.live .arr{ width:13px; height:13px; stroke:var(--accent-hover); flex:0 0 auto;}
  .leaf:not(.live):focus-visible,.leaf.live:focus-visible{ outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- SVG connectors ---------- */
  .connectors{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:1;
    pointer-events:none;
    overflow:visible;
  }
  .connectors path{
    fill:none;
    stroke:var(--border-strong);
    stroke-width:1.6;
    transition:stroke .25s ease;
  }
  .connectors path.active{
    stroke:var(--accent);
    stroke-width:2;
    stroke-dasharray:6 7;
    animation:flow 1.1s linear infinite;
  }
  @keyframes flow{ to{ stroke-dashoffset:-26; } }

  .legend{
    display:flex; align-items:center; gap:8px;
    margin-top:18px; padding:0 4px;
    font-size:12px; color:var(--text-faint);
  }
  .legend .lk{ display:inline-flex; align-items:center; gap:6px; }
  .legend .pill{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  .legend .pill.muted{ background:var(--border-strong); box-shadow:0 0 0 3px var(--bg-subtle);}
  .legend .sep{ color:var(--border-strong); }

  /* ---------- Responsive (vertical reflow) ---------- */
  @media (max-width:860px){
    .map-canvas{ padding:22px 16px; }
    .tree{ flex-direction:column; align-items:stretch; min-height:0; gap:14px; }
    .connectors{ display:none; }
    .root{ margin-right:0; }
    .root-node{ min-width:0; }
    .themes{ gap:10px; }
    .branch{ flex-direction:column; align-items:stretch; }
    .theme-node{ min-width:0; width:100%; }
    .leaves{
      grid-template-columns:1fr;
      grid-template-rows:0fr;
      transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .24s ease, margin .3s ease;
      margin-left:0;
    }
    .branch.open .leaves{
      grid-template-rows:1fr;
      margin-left:0;
      margin-top:8px;
      margin-bottom:2px;
    }
    .leaves-inner{ padding-left:18px; border-left:2px solid var(--border); margin-left:5px; }
    .branch.open > .theme-node{ position:relative; }
  }
  @media (max-width:420px){
    header.hero{ padding:38px 20px 12px; }
    .map-wrap{ padding:0 16px; }
    .leaf{ font-size:12px; padding:6px 11px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; }
    .leaves, .chev, .theme-node, .leaf{ transition:none !important; }
    .connectors path.active{ stroke-dasharray:none; }
  }
</style>
</head>
<body>

<header class="hero">
  <span class="eyebrow"><span class="spark"></span>Interactive reference</span>
  <h1>The Pattern Book</h1>
  <p class="tagline">An interactive map of the patterns behind modern AI systems.</p>
</header>

<div class="map-wrap">
  <div class="map-canvas">
    <svg class="connectors" id="connectors" aria-hidden="true"></svg>
    <div class="tree" id="tree">

      <!-- Root -->
      <div class="root">
        <div class="root-node" id="rootNode">
          <span class="badge">
            <span class="glyph">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/>
                <path d="M7 12h5M12 12l5-5M12 12l5 5"/>
              </svg>
            </span>
            The Pattern Book
          </span>
          <span class="sub">8 themes · 22 patterns</span>
        </div>
      </div>

      <!-- Themes -->
      <div class="themes" id="themes"><!-- injected --></div>

    </div>
  </div>

  <div class="legend">
    <span class="lk"><span class="pill"></span> open page</span>
    <span class="sep">·</span>
    <span class="lk"><span class="pill muted"></span> map node</span>
    <span class="sep">·</span>
    <span>click a theme to expand</span>
  </div>
</div>

<script>
(function(){
  // -------- Taxonomy --------
  const DATA = [
    { id:'retrieval', label:'Retrieval & Knowledge', open:true, leaves:[
        { name:'RAG', href:'../../example/rag.html' },
        { name:'Tool Use' }, { name:'Reranking' }, { name:'Hybrid Search' }
    ]},
    { id:'reasoning', label:'Reasoning & Prompting', open:true, leaves:[
        { name:'Chain-of-Thought', href:'../../patterns/L4-chain-of-thought.html' },
        { name:'Few-Shot' }, { name:'Self-Consistency' }, { name:'Structured Output' }
    ]},
    { id:'eval', label:'Evaluation & Verification', open:false, leaves:[
        { name:'LLM-as-Judge' }, { name:'Reflection' }
    ]},
    { id:'agents', label:'Orchestration & Agents', open:false, leaves:[
        { name:'ReAct' }, { name:'Reflexion' }, { name:'Planner & Executor' }, { name:'Router & Cascade' }
    ]},
    { id:'memory', label:'Memory', open:false, leaves:[
        { name:'Long-Term Memory' }
    ]},
    { id:'serving', label:'Serving & Infrastructure', open:false, leaves:[
        { name:'Speculative Decoding' }, { name:'Semantic Caching' }, { name:'Fallback Chains' }
    ]},
    { id:'training', label:'Training & Data', open:false, leaves:[
        { name:'LoRA / PEFT' }, { name:'DPO / RLHF' }
    ]},
    { id:'builds', label:'Builds', open:false, leaves:[
        { name:'Document Q&A' }, { name:'Coding Agent' }, { name:'Research Agent' }, { name:'Customer Support Agent' }
    ]}
  ];

  const themesEl = document.getElementById('themes');
  const treeEl = document.getElementById('tree');
  const svg = document.getElementById('connectors');

  const arrSvg = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const chevSvg = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  // -------- Build DOM --------
  DATA.forEach(theme=>{
    const branch = document.createElement('div');
    branch.className = 'branch' + (theme.open ? ' open' : '');
    branch.dataset.id = theme.id;

    const node = document.createElement('div');
    node.className = 'theme-node';
    node.setAttribute('role','button');
    node.setAttribute('tabindex','0');
    node.setAttribute('aria-expanded', theme.open ? 'true' : 'false');
    node.innerHTML =
      '<span class="dot"></span>' +
      '<span class="theme-label">'+theme.label+'</span>' +
      '<span class="count">'+theme.leaves.length+'</span>' +
      chevSvg;

    const leaves = document.createElement('div');
    leaves.className = 'leaves';
    const inner = document.createElement('div');
    inner.className = 'leaves-inner';

    theme.leaves.forEach(l=>{
      let leaf;
      if(l.href){
        leaf = document.createElement('a');
        leaf.className = 'leaf live';
        leaf.href = l.href;
        leaf.innerHTML = '<span class="leaf-dot"></span>'+l.name+arrSvg;
      } else {
        leaf = document.createElement('span');
        leaf.className = 'leaf';
        leaf.innerHTML = '<span class="leaf-dot"></span>'+l.name;
      }
      inner.appendChild(leaf);
    });
    leaves.appendChild(inner);

    branch.appendChild(node);
    branch.appendChild(leaves);
    themesEl.appendChild(branch);

    function toggle(){
      const willOpen = !branch.classList.contains('open');
      branch.classList.toggle('open', willOpen);
      node.setAttribute('aria-expanded', willOpen ? 'true':'false');
      // redraw after layout settles
      requestAnimationFrame(()=>requestAnimationFrame(drawConnectors));
      setTimeout(drawConnectors, 360);
    }
    node.addEventListener('click', toggle);
    node.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); }
    });
  });

  // -------- Connectors (desktop only) --------
  const rootNode = document.getElementById('rootNode');

  function drawConnectors(){
    if(window.innerWidth <= 860){ svg.innerHTML=''; return; }
    const canvas = svg.parentElement;
    const cb = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', '0 0 '+cb.width+' '+cb.height);

    const rootR = rootNode.getBoundingClientRect();
    const rx = rootR.right - cb.left;
    const ry = rootR.top + rootR.height/2 - cb.top;

    let paths = '';
    document.querySelectorAll('.branch').forEach(branch=>{
      const node = branch.querySelector('.theme-node');
      const nr = node.getBoundingClientRect();
      const nx = nr.left - cb.left;
      const ny = nr.top + nr.height/2 - cb.top;
      const open = branch.classList.contains('open');

      // root -> theme
      const midx = rx + (nx-rx)*0.5;
      paths += '<path class="'+(open?'active':'')+'" d="M '+rx+' '+ry+' C '+midx+' '+ry+' '+midx+' '+ny+' '+nx+' '+ny+'"/>';

      // theme -> leaves (only when open)
      if(open){
        const leavesInner = branch.querySelector('.leaves-inner');
        const li = leavesInner.getBoundingClientRect();
        const sx = nr.right - cb.left;
        const sy = ny;
        const ex = li.left - cb.left;
        const ey = li.top + Math.min(li.height/2, 26) - cb.top;
        const m2 = sx + (ex-sx)*0.5;
        paths += '<path class="active" d="M '+sx+' '+sy+' C '+m2+' '+sy+' '+m2+' '+ey+' '+ex+' '+ey+'"/>';
      }
    });
    svg.innerHTML = paths;
  }

  // initial + reactive draws
  function refresh(){ requestAnimationFrame(()=>requestAnimationFrame(drawConnectors)); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(refresh); }
  window.addEventListener('load', refresh);
  window.addEventListener('resize', (function(){
    let t; return function(){ clearTimeout(t); t=setTimeout(drawConnectors,90); };
  })());
  refresh();
  setTimeout(drawConnectors, 120);
})();
</script>
</body>
</html>
