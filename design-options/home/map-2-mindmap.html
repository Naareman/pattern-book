<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FCFCFD; --bg-subtle:#F6F7F9; --surface:#FFFFFF;
    --text:#15171C; --text-soft:#565C68; --text-faint:#8A909C;
    --border:#E8EAEE; --border-strong:#D5D9E0;
    --accent:#7C5CF6; --accent-hover:#6D4DE6; --accent-soft:#F0ECFE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    padding:38px 20px 10px;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .hero p{
    margin-top:8px;
    font-size:clamp(14px,2.2vw,16px);
    color:var(--text-soft);
    font-weight:400;
  }

  /* ---------- Stage (desktop radial) ---------- */
  .stage-wrap{
    position:relative;
    width:100%;
    max-width:1080px;
    margin:0 auto;
    padding:0 16px 48px;
  }
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/11;
    max-height:78vh;
  }
  svg.links{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
  }
  .link-path{
    fill:none;
    stroke:var(--border-strong);
    stroke-width:1.6;
    opacity:.85;
    transition:stroke .45s ease, opacity .45s ease, stroke-width .45s ease;
  }
  .link-path.active{
    stroke:var(--accent);
    stroke-width:2.2;
    opacity:1;
  }
  .link-flow{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.4;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .4s ease;
  }
  .link-flow.active{
    opacity:.9;
    stroke-dasharray:6 150;
    animation:flow 2.4s linear infinite;
  }
  @keyframes flow{
    to{stroke-dashoffset:-156}
  }

  /* nodes are absolutely positioned, centered on their coords */
  .node{
    position:absolute;
    transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.22,1,.36,1),
               top .55s cubic-bezier(.22,1,.36,1),
               opacity .45s ease,
               transform .45s ease;
    will-change:left,top;
  }
  .node .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    padding:9px 14px;
    font-size:13px;
    font-weight:500;
    color:var(--text-soft);
    box-shadow:0 1px 2px rgba(20,23,28,.04), 0 4px 14px rgba(20,23,28,.05);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, color .25s ease, background .25s ease;
    cursor:default;
  }
  .node .chip .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--border-strong);
    flex:0 0 auto;
    transition:background .25s ease, box-shadow .25s ease;
  }

  /* central node */
  .node.center .chip{
    background:var(--text);
    color:#fff;
    border-color:var(--text);
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:15px;
    padding:13px 20px;
    border-radius:14px;
    box-shadow:0 6px 22px rgba(20,23,28,.16);
  }
  .node.center .chip .dot{display:none}

  /* theme nodes */
  .node.theme .chip{
    font-size:13.5px;
    color:var(--text);
    padding:10px 16px;
  }
  .node.theme:hover .chip{
    transform:translateY(-1px);
    border-color:var(--border-strong);
    box-shadow:0 2px 4px rgba(20,23,28,.05), 0 8px 22px rgba(20,23,28,.08);
    cursor:pointer;
  }
  .node.theme .chip .dot{background:var(--accent);opacity:.55}

  /* focused theme */
  .node.theme.focused .chip{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
    box-shadow:0 6px 22px rgba(124,92,246,.32);
  }
  .node.theme.focused .chip .dot{background:#fff;opacity:.9}

  /* pattern nodes (revealed) */
  .node.pattern{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none}
  .node.pattern.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .node.pattern .chip{font-size:12.5px;padding:8px 13px}
  .node.pattern.linked .chip{
    color:var(--accent-hover);
    border-color:var(--accent-soft);
    background:var(--accent-soft);
    cursor:pointer;
  }
  .node.pattern.linked .chip .dot{background:var(--accent);opacity:1;box-shadow:0 0 0 3px var(--accent-soft)}
  .node.pattern.linked:hover .chip{
    transform:translateY(-1px);
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(124,92,246,.22);
  }
  .node.pattern .chip .arrow{
    font-size:11px;color:var(--accent);opacity:0;margin-left:-2px;
    transition:opacity .2s ease;
  }
  .node.pattern.linked .chip .arrow{opacity:1}

  /* dimmed state for non-focused themes */
  .node.dim{opacity:.18;pointer-events:none}

  /* back affordance */
  .back-btn{
    position:absolute;
    top:6px;left:6px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:11px;
    padding:8px 14px 8px 11px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text-soft);
    cursor:pointer;
    box-shadow:0 1px 2px rgba(20,23,28,.04), 0 4px 14px rgba(20,23,28,.05);
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease, color .2s ease, border-color .2s ease;
    z-index:10;
  }
  .back-btn.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .back-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .back-btn svg{width:14px;height:14px}

  .hint{
    text-align:center;
    font-size:12.5px;
    color:var(--text-faint);
    margin-top:2px;
    transition:opacity .3s ease;
  }
  .hint.hide{opacity:0}

  /* ---------- Mobile (vertical accordion) ---------- */
  .mobile{display:none;max-width:560px;margin:8px auto 56px;padding:0 18px}
  .m-center{
    text-align:center;
    background:var(--text);
    color:#fff;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:15px;
    padding:13px;
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 6px 22px rgba(20,23,28,.16);
  }
  .m-theme{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:13px;
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(20,23,28,.04);
  }
  .m-theme summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    user-select:none;
  }
  .m-theme summary::-webkit-details-marker{display:none}
  .m-theme summary .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.55;flex:0 0 auto}
  .m-theme summary .chev{margin-left:auto;color:var(--text-faint);transition:transform .3s ease}
  .m-theme[open] summary{color:var(--accent-hover)}
  .m-theme[open] summary .dot{opacity:1;box-shadow:0 0 0 3px var(--accent-soft)}
  .m-theme[open] summary .chev{transform:rotate(180deg);color:var(--accent)}
  .m-patterns{padding:2px 14px 14px;display:flex;flex-wrap:wrap;gap:8px}
  .m-pat{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-subtle);
    border:1px solid var(--border);
    border-radius:11px;
    padding:8px 12px;
    font-size:12.5px;font-weight:500;
    color:var(--text-soft);
    text-decoration:none;
  }
  .m-pat .dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
  .m-pat.linked{
    background:var(--accent-soft);
    border-color:var(--accent-soft);
    color:var(--accent-hover);
  }
  .m-pat.linked .dot{background:var(--accent)}
  .m-pat.linked .arrow{font-size:11px;color:var(--accent)}

  @media (max-width:760px){
    .stage-wrap{display:none}
    .hint{display:none}
    .mobile{display:block}
    .hero{padding:30px 18px 8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
    .link-flow.active{opacity:0 !important}
  }
</style>
</head>
<body>

  <header class="hero">
    <h1>The Pattern Book</h1>
    <p>An interactive map of the patterns behind modern AI systems.</p>
  </header>

  <!-- ============ DESKTOP RADIAL ============ -->
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <button class="back-btn" id="backBtn" aria-label="Back to overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Overview
      </button>
      <svg class="links" id="links" preserveAspectRatio="none"></svg>
      <!-- nodes injected by JS -->
    </div>
    <p class="hint" id="hint">Click a theme to explore its patterns</p>
  </div>

  <!-- ============ MOBILE ACCORDION ============ -->
  <div class="mobile" id="mobile">
    <div class="m-center">The Pattern Book</div>
    <!-- injected -->
  </div>

<script>
(function(){
  "use strict";

  // ---- taxonomy data ----
  // link targets: only RAG and Chain-of-Thought are navigable
  var DATA = [
    { name:"Retrieval & Knowledge", patterns:[
      {n:"RAG", href:"../../example/rag.html"},
      {n:"Tool Use"},{n:"Reranking"},{n:"Hybrid Search"}
    ]},
    { name:"Reasoning & Prompting", patterns:[
      {n:"Chain-of-Thought", href:"../../patterns/L4-chain-of-thought.html"},
      {n:"Few-Shot"},{n:"Self-Consistency"},{n:"Structured Output"}
    ]},
    { name:"Evaluation & Verification", patterns:[
      {n:"LLM-as-Judge"},{n:"Reflection"}
    ]},
    { name:"Orchestration & Agents", patterns:[
      {n:"ReAct"},{n:"Reflexion"},{n:"Planner & Executor"},{n:"Router & Cascade"}
    ]},
    { name:"Memory", patterns:[
      {n:"Long-Term Memory"}
    ]},
    { name:"Serving & Infrastructure", patterns:[
      {n:"Speculative Decoding"},{n:"Semantic Caching"},{n:"Fallback Chains"}
    ]},
    { name:"Training & Data", patterns:[
      {n:"LoRA / PEFT"},{n:"DPO / RLHF"}
    ]},
    { name:"Builds", patterns:[
      {n:"Document Q&A"},{n:"Coding Agent"},{n:"Research Agent"},{n:"Customer Support Agent"}
    ]}
  ];

  /* =========================================================
     DESKTOP RADIAL ENGINE
     Coordinates expressed as % of stage box (0..100).
     ========================================================= */
  var stage   = document.getElementById('stage');
  var svg     = document.getElementById('links');
  var backBtn = document.getElementById('backBtn');
  var hint    = document.getElementById('hint');

  var CX = 50, CY = 50;            // center in %
  var R_THEME = 33;                 // theme ring radius (%)
  var R_PATTERN = 27;               // pattern ring radius around focused theme (%)
  var focusedIndex = -1;

  // build center node
  var centerNode = makeNode('center');
  centerNode.innerHTML = '<span class="chip">The Pattern Book</span>';
  place(centerNode, CX, CY);
  stage.appendChild(centerNode);

  // build theme nodes + their pattern nodes
  var themeNodes = [];
  var n = DATA.length;
  DATA.forEach(function(theme, i){
    var ang = (-90 + (360/n)*i) * Math.PI/180;
    var tx = CX + R_THEME * Math.cos(ang) * (16/11) * 0.9; // slight x-compress for aspect
    var ty = CY + R_THEME * Math.sin(ang);
    // clamp so chips don't overflow edges
    tx = Math.max(12, Math.min(88, tx));
    ty = Math.max(10, Math.min(90, ty));

    var node = makeNode('theme');
    node.dataset.index = i;
    node.dataset.baseX = tx;
    node.dataset.baseY = ty;
    node.innerHTML = '<span class="chip"><span class="dot"></span>'+esc(theme.name)+'</span>';
    place(node, tx, ty);
    node.addEventListener('click', function(){ toggleFocus(i); });
    stage.appendChild(node);

    // pattern child nodes (hidden initially)
    var pats = [];
    theme.patterns.forEach(function(p){
      var pn = makeNode('pattern');
      var linked = !!p.href;
      if(linked) pn.classList.add('linked');
      pn.innerHTML = '<span class="chip"><span class="dot"></span>'+esc(p.n)+
                     (linked?'<span class="arrow">&#8599;</span>':'')+'</span>';
      place(pn, CX, CY);
      if(linked){
        pn.addEventListener('click', function(e){ e.stopPropagation(); window.location.href = p.href; });
      }
      stage.appendChild(pn);
      pats.push(pn);
    });

    themeNodes.push({ node:node, patterns:pats, ang:ang, tx:tx, ty:ty });

    // connector center -> theme
    makeLink(i);
  });

  // pattern connectors are created lazily / reused
  var flowPaths = []; // {path, flow} from focused theme to each pattern

  function makeNode(cls){
    var d = document.createElement('div');
    d.className = 'node ' + cls;
    return d;
  }
  function place(el, xp, yp){
    el.style.left = xp + '%';
    el.style.top  = yp + '%';
  }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- SVG links (theme ring) ----
  // store base + flow path elements keyed by theme index
  var themeLinkEls = [];
  function makeLink(i){
    var base = document.createElementNS('http://www.w3.org/2000/svg','path');
    base.setAttribute('class','link-path');
    var flow = document.createElementNS('http://www.w3.org/2000/svg','path');
    flow.setAttribute('class','link-flow');
    svg.appendChild(base);
    svg.appendChild(flow);
    themeLinkEls.push({base:base, flow:flow});
  }

  // viewBox in svg user units == we use a 0..100 x 0..100 coordinate system
  svg.setAttribute('viewBox','0 0 100 100');

  function curve(x1,y1,x2,y2){
    // smooth quadratic-ish curve bowing toward perpendicular midpoint
    var mx=(x1+x2)/2, my=(y1+y2)/2;
    var dx=x2-x1, dy=y2-y1;
    // perpendicular offset for a gentle bow
    var off=0.16;
    var cx=mx - dy*off, cy=my + dx*off;
    return 'M '+x1+' '+y1+' Q '+cx+' '+cy+' '+x2+' '+y2;
  }

  function drawThemeLinks(){
    themeNodes.forEach(function(t, i){
      var x = pctX(t.node), y = pctY(t.node);
      var d = curve(CX, CY, x, y);
      themeLinkEls[i].base.setAttribute('d', d);
      themeLinkEls[i].flow.setAttribute('d', d);
    });
  }
  function pctX(el){ return parseFloat(el.style.left); }
  function pctY(el){ return parseFloat(el.style.top); }

  drawThemeLinks();

  // ---- focus logic ----
  function toggleFocus(i){
    if(focusedIndex === i){ resetOverview(); return; }
    focusedIndex = i;
    hint.classList.add('hide');
    backBtn.classList.add('show');

    themeNodes.forEach(function(t, idx){
      t.node.classList.remove('focused','dim');
      themeLinkEls[idx].base.classList.remove('active');
      themeLinkEls[idx].flow.classList.remove('active');
      // hide all patterns first
      t.patterns.forEach(function(pn){ pn.classList.remove('show'); place(pn, CX, CY); });

      if(idx === i){
        t.node.classList.add('focused');
        // move focused theme toward center-ish (between center and its spot)
        var fx = CX + (t.tx - CX)*0.30;
        var fy = CY + (t.ty - CY)*0.30;
        place(t.node, fx, fy);
        themeLinkEls[idx].base.classList.add('active');
        themeLinkEls[idx].flow.classList.add('active');
        // reveal patterns in an arc around focused node
        revealPatterns(t, fx, fy);
      } else {
        t.node.classList.add('dim');
        place(t.node, t.tx, t.ty);
      }
    });
    requestAnimationFrame(updateLinksDuringFocus);
    // redraw a few times during the transition so curves follow nodes
    animateLinkRedraw();
  }

  function revealPatterns(t, fx, fy){
    var m = t.patterns.length;
    // arc facing away from center
    var baseAng = Math.atan2(fy - CY, fx - CX); // direction outward
    var spread = Math.min(Math.PI*1.15, 0.55*m + 0.6);
    t.patterns.forEach(function(pn, k){
      var a = baseAng + (k - (m-1)/2) * (spread/Math.max(1,(m-1||1)));
      var px = fx + R_PATTERN * Math.cos(a) * (16/11) * 0.92;
      var py = fy + R_PATTERN * Math.sin(a);
      px = Math.max(10, Math.min(90, px));
      py = Math.max(9,  Math.min(91, py));
      place(pn, px, py);
      // stagger reveal
      setTimeout(function(){ pn.classList.add('show'); }, 120 + k*45);
    });
    buildPatternFlows(t, fx, fy);
  }

  // pattern connector lines from focused theme to each pattern
  function buildPatternFlows(t, fx, fy){
    // clear old
    flowPaths.forEach(function(p){ svg.removeChild(p.base); svg.removeChild(p.flow); });
    flowPaths = [];
    t.patterns.forEach(function(pn){
      var base = document.createElementNS('http://www.w3.org/2000/svg','path');
      base.setAttribute('class','link-path active');
      var flow = document.createElementNS('http://www.w3.org/2000/svg','path');
      flow.setAttribute('class','link-flow active');
      svg.appendChild(base); svg.appendChild(flow);
      flowPaths.push({base:base, flow:flow, target:pn, fx:fx, fy:fy});
    });
  }

  function updatePatternFlows(){
    flowPaths.forEach(function(p){
      var x = pctX(p.target), y = pctY(p.target);
      var d = curve(p.fx, p.fy, x, y);
      p.base.setAttribute('d', d);
      p.flow.setAttribute('d', d);
    });
  }

  function updateLinksDuringFocus(){
    drawThemeLinks();
    updatePatternFlows();
  }

  function animateLinkRedraw(){
    var start = performance.now();
    function step(now){
      updateLinksDuringFocus();
      if(now - start < 700) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function resetOverview(){
    focusedIndex = -1;
    backBtn.classList.remove('show');
    hint.classList.remove('hide');
    themeNodes.forEach(function(t, idx){
      t.node.classList.remove('focused','dim');
      place(t.node, t.tx, t.ty);
      themeLinkEls[idx].base.classList.remove('active');
      themeLinkEls[idx].flow.classList.remove('active');
      t.patterns.forEach(function(pn){ pn.classList.remove('show'); place(pn, CX, CY); });
    });
    // remove pattern flows
    flowPaths.forEach(function(p){ svg.removeChild(p.base); svg.removeChild(p.flow); });
    flowPaths = [];
    animateLinkRedraw();
  }

  backBtn.addEventListener('click', resetOverview);
  // ESC returns to overview
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && focusedIndex>=0) resetOverview(); });

  // redraw on resize (coords are %, but flow follows nodes)
  window.addEventListener('resize', function(){ updateLinksDuringFocus(); });

  /* =========================================================
     MOBILE ACCORDION
     ========================================================= */
  var mobile = document.getElementById('mobile');
  DATA.forEach(function(theme){
    var det = document.createElement('details');
    det.className = 'm-theme';
    var sum = document.createElement('summary');
    sum.innerHTML = '<span class="dot"></span>'+esc(theme.name)+
      '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    det.appendChild(sum);
    var wrap = document.createElement('div');
    wrap.className = 'm-patterns';
    theme.patterns.forEach(function(p){
      var linked = !!p.href;
      var el;
      if(linked){
        el = document.createElement('a');
        el.href = p.href;
        el.className = 'm-pat linked';
        el.innerHTML = '<span class="dot"></span>'+esc(p.n)+'<span class="arrow">&#8599;</span>';
      } else {
        el = document.createElement('span');
        el.className = 'm-pat';
        el.innerHTML = '<span class="dot"></span>'+esc(p.n);
      }
      wrap.appendChild(el);
    });
    det.appendChild(wrap);
    mobile.appendChild(det);
  });

})();
</script>
</body>
</html>
