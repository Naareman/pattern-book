<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============ TOKENS (locked light + violet) ============ */
  :root {
    --bg: #FCFCFD;
    --surface: #FFFFFF;
    --text: #15171C;
    --text-soft: #565C68;
    --text-faint: #8A909C;
    --border: #E8EAEE;
    --border-strong: #D5D9E0;
    --accent: #7C5CF6;
    --accent-hover: #6D4DE6;
    --accent-soft: #F0ECFE;
    --shadow-sm: 0 2px 4px rgba(16, 24, 40, .04);
    --shadow-md: 0 6px 20px rgba(16, 24, 40, .07);
    --shadow-lg: 0 12px 36px rgba(16, 24, 40, .10);
    --glow: 0 0 0 rgba(124, 92, 246, 0);
    --node-glow: 0 10px 30px rgba(124, 92, 246, .22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    min-height: 100vh;
  }
  ::selection { background: var(--accent-soft); color: var(--text); }
  a { color: inherit; text-decoration: none; }

  .wrap {
    position: relative;
    max-width: 1040px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px) clamp(40px, 7vw, 72px);
  }

  /* ============ HEADER ============ */
  .head { text-align: center; margin-bottom: clamp(36px, 7vw, 68px); }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 16px;
  }
  .wordmark .mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-hover));
    flex: none;
  }
  .wordmark .mark svg { width: 17px; height: 17px; display: block; }
  .wordmark .name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: clamp(24px, 5vw, 34px);
    letter-spacing: -.01em;
    color: var(--text);
  }
  .wordmark .name em { font-style: italic; font-weight: 500; color: var(--accent); }
  .head .lede {
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--text-soft);
    font-weight: 450;
  }

  /* ============ THE ONE PICTURE ============ */
  .picture {
    position: relative;
    display: grid;
    /* three columns: the stacked blocks | the arrow | the product */
    grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: clamp(16px, 4vw, 44px);
    row-gap: 0;
    max-width: 880px;
    margin: 0 auto;
    padding-top: clamp(34px, 6vw, 56px); /* room for the band label on top */
  }

  /* --- big clickable idea zones --- */
  .idea {
    position: relative;
    display: block;
    border-radius: 18px;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    outline: none;
  }
  .idea:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 4px var(--accent);
  }

  .idea-label {
    text-align: center;
    margin-top: 14px;
  }
  .idea-label .title {
    font-size: clamp(17px, 3vw, 21px);
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--text);
  }
  .idea-label .gloss {
    display: block;
    font-size: clamp(12.5px, 2vw, 14px);
    color: var(--text-soft);
    margin-top: 3px;
    max-width: 220px;
    margin-left: auto;
    margin-right: auto;
  }
  .idea-hint {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 9px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    opacity: 0;
    transform: translateY(2px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .idea-hint .arr { transition: transform .2s ease; }
  .idea:hover .idea-hint,
  .idea:focus-visible .idea-hint { opacity: 1; transform: translateY(0); }
  .idea:hover .idea-hint .arr { transform: translateX(3px); }

  /* ---- 1) LAYERS : stacked blocks ---- */
  .col-layers { grid-column: 1; }
  .blocks {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    padding: clamp(20px, 3.5vw, 30px) clamp(18px, 3vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .block {
    height: clamp(34px, 6vw, 44px);
    border-radius: 11px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    transition: transform .2s ease, background-color .2s ease;
  }
  .block.b1 { background: #EAE3FE; }
  .block.b2 { background: #F0ECFE; }
  .block.b3 { background: #F6F3FF; }
  .idea.col-layers:hover .blocks {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg), var(--node-glow);
  }
  .idea.col-layers:hover .block { transform: scale(1.015); }
  .idea.col-layers:hover .blocks { transform: translateY(-2px); }

  /* ---- 2) DISCIPLINES : band across the blocks ---- */
  .band {
    position: absolute;
    z-index: 4;
    top: clamp(8px, 1.6vw, 14px);
    /* spans from inside the blocks, across the arrow, toward the product */
    left: clamp(4px, 1vw, 14px);
    width: calc(60% + clamp(8px, 4vw, 44px));
    height: clamp(40px, 6.5vw, 50px);
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(90deg, rgba(124,92,246,.10), rgba(124,92,246,.16), rgba(124,92,246,.10));
    border: 1px dashed var(--accent);
    color: var(--accent);
    transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    outline: none;
  }
  .band:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 4px var(--accent);
  }
  .band .band-text {
    font-size: clamp(13px, 2.2vw, 15px);
    font-weight: 600;
    letter-spacing: -.01em;
    white-space: nowrap;
  }
  .band .band-text .g {
    font-weight: 450;
    color: var(--accent-hover);
    opacity: .85;
  }
  .band .band-hint {
    font-size: 11px;
    font-weight: 500;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .band:hover, .band:focus-visible {
    background: linear-gradient(90deg, rgba(124,92,246,.16), rgba(124,92,246,.24), rgba(124,92,246,.16));
    box-shadow: var(--node-glow);
  }
  .band:hover .band-hint, .band:focus-visible .band-hint { opacity: .9; }

  /* ---- the ARROW that comes OUT of the blocks ---- */
  .arrow-cell {
    grid-column: 2;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arrow {
    width: clamp(40px, 7vw, 90px);
    height: 26px;
    display: block;
    overflow: visible;
  }
  .arrow .track { stroke: var(--border-strong); stroke-width: 3; stroke-linecap: round; }
  .arrow .head  { fill: var(--accent); }
  .arrow .spark {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 14 200;
    stroke-dashoffset: 200;
    animation: travel 3.4s ease-in-out infinite;
  }
  @keyframes travel {
    0%   { stroke-dashoffset: 200; opacity: 0; }
    12%  { opacity: 1; }
    60%  { stroke-dashoffset: 40; opacity: 1; }
    78%  { opacity: 0; }
    100% { stroke-dashoffset: 40; opacity: 0; }
  }

  /* ---- 3) BUILDS : the product shape ---- */
  .col-builds { grid-column: 3; }
  .product {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    padding: clamp(22px, 3.5vw, 32px);
    display: grid;
    place-items: center;
    aspect-ratio: 1 / 1;
    max-width: 200px;
    margin: 0 auto;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .product .prod-glyph {
    width: 64%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: linear-gradient(145deg, var(--accent), var(--accent-hover));
    display: grid;
    place-items: center;
    box-shadow: var(--node-glow);
  }
  .product .prod-glyph svg { width: 46%; height: 46%; display: block; }
  .idea.col-builds:hover .product {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg), var(--node-glow);
    transform: translateY(-2px);
  }

  /* ============ TIE-IT-TOGETHER CAPTION ============ */
  .caption {
    text-align: center;
    margin-top: clamp(40px, 7vw, 64px);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: clamp(18px, 3.4vw, 26px);
    line-height: 1.35;
    letter-spacing: -.01em;
    color: var(--text);
    max-width: 620px;
    margin-left: auto;
    margin-right: auto;
  }
  .caption b { color: var(--accent); font-weight: 500; font-style: italic; }

  /* ============ RESPONSIVE : stack vertically, keep the story ============ */
  @media (max-width: 680px) {
    .picture {
      grid-template-columns: 1fr;
      row-gap: 0;
      padding-top: clamp(30px, 9vw, 48px);
      max-width: 360px;
    }
    .col-layers { grid-column: 1; grid-row: 1; }
    .arrow-cell { grid-column: 1; grid-row: 2; }
    .col-builds { grid-column: 1; grid-row: 3; }

    /* the arrow now points DOWN, out of the bottom of the blocks into the product */
    .arrow-cell { padding: clamp(10px, 3vw, 18px) 0; }
    .arrow {
      width: 26px;
      height: clamp(42px, 12vw, 60px);
      transform: rotate(90deg);
    }
    .arrow .spark { animation-name: travel; }

    .product { max-width: 168px; }

    /* the band now runs vertically along the LEFT of the blocks + arrow + product,
       so it still visibly touches all three */
    .band {
      top: clamp(30px, 9vw, 48px);
      bottom: 0;
      left: clamp(-2px, 0vw, 0px);
      width: clamp(42px, 12vw, 52px);
      height: auto;
      flex-direction: column;
      gap: 10px;
    }
    .band .band-text { writing-mode: vertical-rl; transform: rotate(180deg); }
    .band .band-text .g { display: none; } /* keep tiny screens clean */
    .band .band-hint { display: none; }

    /* give the stacked column room so the vertical band sits beside it */
    .picture { padding-left: clamp(54px, 16vw, 64px); }
  }

  @media (max-width: 380px) {
    .idea-label .gloss { max-width: 200px; }
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .arrow .spark { display: none; }
  }
</style>
</head>
<body>
  <main class="wrap">

    <!-- HEADER -->
    <header class="head">
      <span class="wordmark">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/>
            <path d="M12 3v18"/>
          </svg>
        </span>
        <span class="name">The <em>Pattern</em> Book</span>
      </span>
      <p class="lede">How AI systems are built.</p>
    </header>

    <!-- THE ONE THREE-IDEA PICTURE -->
    <section class="picture" aria-label="Three ideas: layers, disciplines, and builds">

      <!-- 2) DISCIPLINES : a band running across everything -->
      <a class="band" href="#" aria-label="Open Disciplines: what matters in every part, like safety and cost">
        <span class="band-text">Disciplines <span class="g">· in every part</span></span>
        <span class="band-hint">open Disciplines &rarr;</span>
      </a>

      <!-- 1) LAYERS : stacked blocks -->
      <a class="idea col-layers" href="#" aria-label="Open Layers: the parts an AI is built from">
        <span class="blocks" aria-hidden="true">
          <span class="block b1"></span>
          <span class="block b2"></span>
          <span class="block b3"></span>
        </span>
        <span class="idea-label">
          <span class="title">Layers</span>
          <span class="gloss">the parts an AI is built from</span>
          <span class="idea-hint">open Layers <span class="arr">&rarr;</span></span>
        </span>
      </a>

      <!-- ARROW : comes OUT of the blocks toward the product -->
      <div class="arrow-cell" aria-hidden="true">
        <svg class="arrow" viewBox="0 0 90 26" preserveAspectRatio="none">
          <line class="track" x1="4" y1="13" x2="74" y2="13"/>
          <path class="head" d="M72 5 L88 13 L72 21 Z"/>
          <line class="spark" x1="4" y1="13" x2="74" y2="13"/>
        </svg>
      </div>

      <!-- 3) BUILDS : the product the stack makes -->
      <a class="idea col-builds" href="#" aria-label="Open Builds: the real tools you make, like a coding helper">
        <span class="product" aria-hidden="true">
          <span class="prod-glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"/>
            </svg>
          </span>
        </span>
        <span class="idea-label">
          <span class="title">Builds</span>
          <span class="gloss">the real tools you make, like a coding helper</span>
          <span class="idea-hint">open Builds <span class="arr">&rarr;</span></span>
        </span>
      </a>

    </section>

    <!-- ONE PLAIN CAPTION TYING IT TOGETHER -->
    <p class="caption">
      Stack the parts, <b>mind what matters</b> across them, and build something real.
    </p>

  </main>
</body>
</html>
