<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Pattern Book — How AI systems are built, layer by layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============ TOKENS (locked light-violet) ============ */
  :root {
    --bg: #FCFCFD;
    --bg-subtle: #F6F7F9;
    --surface: #FFFFFF;
    --text: #15171C;
    --text-soft: #565C68;
    --text-faint: #8A909C;
    --border: #E8EAEE;
    --border-strong: #D5D9E0;
    --accent: #7C5CF6;
    --accent-hover: #6D4DE6;
    --accent-soft: #F0ECFE;
    --shadow-sm: 0 2px 4px rgba(16, 24, 40, .04);
    --shadow-md: 0 6px 20px rgba(16, 24, 40, .07);
    --shadow-lg: 0 12px 36px rgba(16, 24, 40, .10);
    --node-glow: 0 6px 22px rgba(124, 92, 246, .28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent-soft); color: var(--text); }

  /* ============ HEADER ============ */
  .nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px clamp(16px, 5vw, 40px) 4px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-hover));
    flex: none;
  }
  .brand-mark svg { width: 16px; height: 16px; display: block; }
  .wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: clamp(19px, 3.4vw, 24px);
    letter-spacing: -.01em;
    line-height: 1;
  }
  .wordmark em { font-style: italic; font-weight: 500; color: var(--accent); }
  .subline {
    margin: 6px auto 0;
    max-width: 1080px;
    padding: 0 clamp(16px, 5vw, 40px);
    color: var(--text-soft);
    font-size: clamp(13.5px, 2vw, 15px);
    font-weight: 450;
  }

  /* ============ STAGE ============ */
  .stage-wrap {
    max-width: 1080px;
    margin: clamp(14px, 3vw, 28px) auto clamp(40px, 6vw, 64px);
    padding: 0 clamp(16px, 5vw, 40px);
  }

  /* the layout: disciplines | machine | builds */
  .scene {
    display: grid;
    grid-template-columns: 168px minmax(220px, 360px) 1fr;
    align-items: center;
    gap: 0;
    position: relative;
  }

  /* ---- DISCIPLINES (left rail of icons touching every layer) ---- */
  .disciplines {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-self: stretch;
    padding: 14px 0;
    position: relative;
    z-index: 3;
  }
  .disc {
    display: flex;
    align-items: center;
    gap: 9px;
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 9px;
    font: inherit;
    color: var(--text-soft);
    text-align: left;
    width: 100%;
  }
  .disc:hover, .disc:focus-visible, .disc.lit {
    color: var(--accent);
    outline: none;
  }
  .disc-ico {
    width: 34px; height: 34px;
    border-radius: 10px;
    flex: none;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    box-shadow: var(--shadow-sm);
  }
  .disc-ico svg { width: 17px; height: 17px; }
  .disc:hover .disc-ico, .disc:focus-visible .disc-ico, .disc.lit .disc-ico {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: var(--node-glow);
  }
  .disc-label { font-size: 12.5px; font-weight: 500; letter-spacing: -.01em; }

  /* the connector lines from rail to machine (SVG overlay) */
  .disc-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .disc-lines path {
    fill: none;
    stroke: var(--border-strong);
    stroke-width: 1.4;
  }
  .disc-lines .tick { fill: var(--border-strong); }
  .disc-lines.lit path { stroke: var(--accent); stroke-width: 1.8; }
  .disc-lines.lit .tick { fill: var(--accent); }

  /* ---- THE MACHINE (the tower) ---- */
  .machine {
    position: relative;
    z-index: 2;
    border: 1.5px solid var(--border-strong);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  /* the unifying machine "spine" up the middle so it reads as one device */
  .machine::before {
    content: "";
    position: absolute;
    top: -9px; left: 50%;
    transform: translateX(-50%);
    width: 46px; height: 9px;
    border-radius: 6px 6px 0 0;
    background: var(--border-strong);
  }
  .machine::after {
    content: "";
    position: absolute;
    bottom: -9px; left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 9px;
    border-radius: 0 0 6px 6px;
    background: var(--border-strong);
  }

  .layer {
    position: relative;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    border-radius: 12px;
    padding: 11px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background .16s ease, border-color .16s ease,
                box-shadow .16s ease, transform .16s ease, color .16s ease;
  }
  .layer:hover, .layer:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: none;
    transform: translateX(2px);
  }
  .layer-name {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .layer-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--border-strong);
  }
  .layer:hover .layer-dot, .layer:focus-visible .layer-dot { background: var(--accent); }
  .layer-arrow {
    margin-left: auto;
    color: var(--text-faint);
    opacity: 0;
    transition: opacity .16s ease, transform .16s ease;
    font-size: 14px;
  }
  .layer:hover .layer-arrow, .layer:focus-visible .layer-arrow {
    opacity: 1; transform: translateX(2px); color: var(--accent);
  }

  /* highlight when a discipline lights every layer */
  .machine.lit .layer { border-color: var(--accent); }
  .machine.lit .layer .layer-dot { background: var(--accent); }

  /* highlight when a build lights its source layers */
  .layer.sourced {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: var(--node-glow);
  }
  .layer.sourced .layer-dot { background: var(--accent); }

  /* ---- BUILDS (outputs) ---- */
  .builds {
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding-left: clamp(28px, 7vw, 92px);
    position: relative;
    z-index: 3;
  }
  .builds-cap {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 2px;
  }
  .build {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px 9px 11px;
    cursor: pointer;
    font: inherit;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: border-color .16s ease, box-shadow .16s ease,
                transform .16s ease, color .16s ease;
    width: fit-content;
    max-width: 100%;
  }
  .build:hover, .build:focus-visible, .build.active {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateX(3px);
    outline: none;
  }
  .build-ico {
    width: 28px; height: 28px;
    border-radius: 8px;
    flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .build-ico svg { width: 15px; height: 15px; }
  .build-name { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }

  /* the output arrows (SVG overlay machine -> builds) */
  .build-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .build-lines path { fill: none; stroke: var(--border-strong); stroke-width: 1.6; }
  .build-lines polygon { fill: var(--border-strong); }
  .build-lines .flow {
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 5 200;
    stroke-dashoffset: 0;
    opacity: .9;
  }

  /* slow pulse travelling one output arrow */
  @keyframes travel { to { stroke-dashoffset: -205; } }
  .build-lines .flow.pulsing { animation: travel 3.4s linear infinite; }

  /* ============ DRILL-IN SHEET ============ */
  .sheet-scrim {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(16, 24, 40, .28);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .sheet-scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    z-index: 91;
    top: 0; right: 0;
    height: 100%;
    width: min(440px, 92vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    transform: translateX(102%);
    transition: transform .26s cubic-bezier(.2,.7,.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet.open { transform: translateX(0); }
  .sheet-head {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .sheet-head .h-ico {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border);
  }
  .sheet-head .h-ico svg { width: 19px; height: 19px; }
  .sheet-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--accent);
  }
  .sheet-title { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
  .sheet-desc { font-size: 13px; color: var(--text-soft); margin-top: 6px; line-height: 1.5; }
  .sheet-close {
    margin-left: auto;
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer; flex: none;
    display: grid; place-items: center;
  }
  .sheet-close:hover { color: var(--accent); border-color: var(--accent); }
  .sheet-close svg { width: 15px; height: 15px; }
  .sheet-body { padding: 16px 24px 28px; overflow-y: auto; }
  .sheet-body .grp-label {
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-faint);
    margin: 4px 0 12px;
  }
  .pat {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    background: var(--bg-subtle);
  }
  .pat.link { cursor: pointer; transition: border-color .16s, box-shadow .16s, transform .16s, background .16s; }
  .pat.link:hover {
    border-color: var(--accent); background: var(--surface);
    box-shadow: var(--shadow-md); transform: translateX(2px);
  }
  .pat-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--border-strong);
  }
  .pat.link .pat-dot { background: var(--accent); }
  .pat-body { min-width: 0; }
  .pat-name { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .pat-name .open-tag {
    margin-left: 7px;
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 7px; vertical-align: middle;
  }
  .pat-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .pat-arrow { margin-left: auto; color: var(--accent); flex: none; opacity: 0; transition: opacity .16s, transform .16s; }
  .pat.link:hover .pat-arrow { opacity: 1; transform: translateX(2px); }
  .pat-arrow svg { width: 15px; height: 15px; }

  .foot {
    border-top: 1px solid var(--border);
    padding: 22px clamp(16px, 5vw, 40px);
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .foot strong { color: var(--text-soft); font-weight: 500; }

  /* ============ RESPONSIVE ============ */
  /* tablet: keep three columns but tighten */
  @media (max-width: 880px) {
    .scene { grid-template-columns: 150px minmax(190px, 1fr) 150px; }
    .builds { padding-left: clamp(20px, 5vw, 48px); }
    .build-name { font-size: 12.5px; }
  }

  /* mobile: tower stays vertical & central; disciplines become a chip row
     ABOVE, builds become a labelled row BELOW. No SVG overlays (hidden). */
  @media (max-width: 640px) {
    .scene { display: block; position: static; }
    .disc-lines, .build-lines { display: none; }

    .disciplines {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      padding: 0;
      margin-bottom: 16px;
    }
    .disc-rail-cap, .builds-cap.m-cap { display: block; }
    .disc {
      width: auto;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      padding: 6px 11px 6px 7px;
      border-radius: 999px;
    }
    .disc-ico { width: 24px; height: 24px; border: 0; box-shadow: none; background: transparent; color: var(--accent); }
    .disc-ico svg { width: 16px; height: 16px; }

    .machine { max-width: 420px; margin: 0 auto; }
    .machine::before, .machine::after { display: none; }

    .builds {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      padding: 0;
      margin-top: 18px;
    }
    .build { transform: none; }
    .build:hover, .build:focus-visible, .build.active { transform: translateY(-2px); }
  }
  @media (min-width: 641px) {
    .disc-rail-cap, .builds-cap.m-cap { display: none; }
  }

  /* the tiny "applies to all layers" hint chips (mobile only sentence) */
  .rail-hint, .build-hint {
    display: none;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    margin: 0 auto;
  }
  @media (max-width: 640px) {
    .rail-hint { display: block; margin-bottom: 10px; }
    .build-hint { display: block; margin-top: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .build-lines .flow.pulsing { animation: none; }
  }
</style>
</head>
<body>

  <!-- HEADER: slim wordmark + one line -->
  <header>
    <div class="nav">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M12 3v18"/>
        </svg>
      </span>
      <span class="wordmark">The <em>Pattern</em> Book</span>
    </div>
    <p class="subline">How AI systems are built, layer by layer.</p>
  </header>

  <!-- THE PICTURE -->
  <main class="stage-wrap">
    <p class="rail-hint">These run alongside every layer</p>

    <div class="scene" id="scene">

      <!-- discipline connector lines (desktop overlay) -->
      <svg class="disc-lines" id="discLines" preserveAspectRatio="none" aria-hidden="true"></svg>
      <!-- build output arrows (desktop overlay) -->
      <svg class="build-lines" id="buildLines" preserveAspectRatio="none" aria-hidden="true"></svg>

      <!-- DISCIPLINES rail -->
      <div class="disciplines" id="disciplines">
        <span class="disc-rail-cap builds-cap m-cap" aria-hidden="true">Run across every layer</span>

        <button class="disc" data-disc="eval" type="button" aria-label="Evaluation runs across every layer">
          <span class="disc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-3"/><circle cx="12" cy="13" r="1.3" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="disc-label">Evaluation</span>
        </button>

        <button class="disc" data-disc="safety" type="button" aria-label="Safety runs across every layer">
          <span class="disc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>
          </span>
          <span class="disc-label">Safety</span>
        </button>

        <button class="disc" data-disc="privacy" type="button" aria-label="Privacy runs across every layer">
          <span class="disc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <span class="disc-label">Privacy</span>
        </button>

        <button class="disc" data-disc="obs" type="button" aria-label="Observability runs across every layer">
          <span class="disc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </span>
          <span class="disc-label">Observability</span>
        </button>

        <button class="disc" data-disc="cost" type="button" aria-label="Cost runs across every layer">
          <span class="disc-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2c0-1.2 1.1-1.7 2.5-1.7s2.5.6 2.5 1.9c0 2.6-5 1.4-5 4 0 1.3 1.1 2 2.5 2s2.5-.5 2.5-1.7"/></svg>
          </span>
          <span class="disc-label">Cost</span>
        </button>
      </div>

      <!-- THE MACHINE (tower of layers, top -> bottom) -->
      <div class="machine" id="machine">
        <button class="layer" data-layer="ux" type="button"><span class="layer-dot"></span><span class="layer-name">User experience</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="app" type="button"><span class="layer-dot"></span><span class="layer-name">Application patterns</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="orch" type="button"><span class="layer-dot"></span><span class="layer-name">Orchestration &amp; agents</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="single" type="button"><span class="layer-dot"></span><span class="layer-name">Single-call control</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="memory" type="button"><span class="layer-dot"></span><span class="layer-name">Memory</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="retrieval" type="button"><span class="layer-dot"></span><span class="layer-name">Retrieval</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="comp" type="button"><span class="layer-dot"></span><span class="layer-name">Composition</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="train" type="button"><span class="layer-dot"></span><span class="layer-name">Training &amp; adaptation</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="serve" type="button"><span class="layer-dot"></span><span class="layer-name">Serving &amp; infrastructure</span><span class="layer-arrow">&rsaquo;</span></button>
        <button class="layer" data-layer="data" type="button"><span class="layer-dot"></span><span class="layer-name">Data &amp; artifacts</span><span class="layer-arrow">&rsaquo;</span></button>
      </div>

      <!-- BUILDS (outputs) -->
      <div class="builds" id="builds">
        <span class="builds-cap m-cap" aria-hidden="true">What it builds</span>

        <button class="build" data-build="coding" type="button">
          <span class="build-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg></span>
          <span class="build-name">Coding Agent</span>
        </button>

        <button class="build" data-build="docqa" type="button">
          <span class="build-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg></span>
          <span class="build-name">Document Q&amp;A</span>
        </button>

        <button class="build" data-build="research" type="button">
          <span class="build-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg></span>
          <span class="build-name">Research Agent</span>
        </button>

        <button class="build" data-build="support" type="button">
          <span class="build-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-3.2 6.9L21 20z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg></span>
          <span class="build-name">Support Agent</span>
        </button>
      </div>

    </div>

    <p class="build-hint">Built by the machine &rarr;</p>
  </main>

  <footer class="foot">
    <strong>The Pattern Book</strong> &nbsp;·&nbsp; click any layer to see its patterns
  </footer>

  <!-- DRILL-IN SHEET -->
  <div class="sheet-scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <div class="sheet-head">
      <span class="h-ico" id="sheetIco" aria-hidden="true"></span>
      <div>
        <div class="sheet-eyebrow">Layer</div>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-desc" id="sheetDesc"></div>
      </div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="grp-label">Patterns in this layer</div>
      <div id="sheetList"></div>
    </div>
  </aside>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------
     LAYER CONTENT (the only place lists/details appear)
     Only RAG and Chain-of-Thought link out; everything else is inert.
  ------------------------------------------------------------------ */
  var LAYER_ICON = {
    ux:        '<path d="M4 5h16v11H4zM2 20h20M9.5 16v4M14.5 16v4"/>',
    app:       '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    orch:      '<circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M10.5 7.5L7.5 16M13.5 7.5l3 8.5M8.5 18h7"/>',
    single:    '<path d="M12 5a7 7 0 1 0 7 7"/><path d="M12 5v4l3 2M19 5l-3 1 1-3"/>',
    memory:    '<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M5 9h14M9 5v14M2 8h3M2 12h3M2 16h3M19 8h3M19 12h3M19 16h3"/>',
    retrieval: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
    comp:      '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/>',
    train:     '<path d="M5 19V9M12 19V5M19 19v-7"/><path d="M3 19h18"/>',
    serve:     '<rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/>',
    data:      '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>'
  };

  var LAYERS = {
    ux: { title: 'User experience', desc: 'How people see, steer, and trust the system.', patterns: [
      { name: 'Streaming responses', sub: 'Show tokens as they arrive' },
      { name: 'Citations & sources', sub: 'Point back to the evidence' },
      { name: 'Human-in-the-loop', sub: 'Pause for approval on risky steps' }
    ]},
    app: { title: 'Application patterns', desc: 'The recognisable shapes whole products are built on.', patterns: [
      { name: 'Question answering', sub: 'Ask, get a grounded reply' },
      { name: 'Summarisation', sub: 'Long input, short output' },
      { name: 'Classification & routing', sub: 'Sort and send to the right path' }
    ]},
    orch: { title: 'Orchestration & agents', desc: 'Many model calls and tools working as one loop.', patterns: [
      { name: 'Tool use', sub: 'Let the model call functions' },
      { name: 'ReAct loop', sub: 'Reason, act, observe, repeat' },
      { name: 'Planner / executor', sub: 'Plan first, then carry it out' }
    ]},
    single: { title: 'Single-call control', desc: 'Getting the most from one model call.', patterns: [
      { name: 'Chain-of-Thought', sub: 'Make the model show its steps', href: '../../patterns/L4-chain-of-thought.html' },
      { name: 'Few-shot prompting', sub: 'Teach by examples in the prompt' },
      { name: 'Structured output', sub: 'Force clean JSON or schema' }
    ]},
    memory: { title: 'Memory', desc: 'What the system remembers between turns and sessions.', patterns: [
      { name: 'Conversation buffer', sub: 'Keep the recent turns' },
      { name: 'Summary memory', sub: 'Compress old turns into notes' },
      { name: 'Long-term store', sub: 'Persist facts about the user' }
    ]},
    retrieval: { title: 'Retrieval', desc: 'Finding the right context before the model answers.', patterns: [
      { name: 'RAG', sub: 'Look things up, then answer from them', href: '../../example/rag.html' },
      { name: 'Hybrid search', sub: 'Mix keyword and vector search' },
      { name: 'Re-ranking', sub: 'Sort results by real relevance' }
    ]},
    comp: { title: 'Composition', desc: 'Combining models and steps into bigger flows.', patterns: [
      { name: 'Prompt chaining', sub: 'Feed one output into the next' },
      { name: 'Routing', sub: 'Pick the right model per task' },
      { name: 'Parallel fan-out', sub: 'Run many calls, then merge' }
    ]},
    train: { title: 'Training & adaptation', desc: 'Teaching a model new behaviour.', patterns: [
      { name: 'Fine-tuning', sub: 'Adjust weights on your data' },
      { name: 'LoRA adapters', sub: 'Lightweight, swappable tuning' },
      { name: 'Preference tuning', sub: 'Align to what people prefer' }
    ]},
    serve: { title: 'Serving & infrastructure', desc: 'Running models fast, cheap, and reliably.', patterns: [
      { name: 'Batching', sub: 'Group requests for throughput' },
      { name: 'KV cache', sub: 'Reuse attention state' },
      { name: 'Autoscaling', sub: 'Match capacity to demand' }
    ]},
    data: { title: 'Data & artifacts', desc: 'The raw material everything is built from.', patterns: [
      { name: 'Chunking', sub: 'Split documents for retrieval' },
      { name: 'Embeddings', sub: 'Turn text into vectors' },
      { name: 'Versioned datasets', sub: 'Track what trained what' }
    ]}
  };

  /* which layers each build draws from (for the optional light-up) */
  var BUILD_SOURCES = {
    coding:   ['ux','app','orch','single','memory','serve','data'],
    docqa:    ['ux','app','single','retrieval','comp','data'],
    research: ['ux','app','orch','single','memory','retrieval','comp'],
    support:  ['ux','app','orch','single','memory','retrieval','serve']
  };

  var scene = document.getElementById('scene');
  var machine = document.getElementById('machine');
  var discLines = document.getElementById('discLines');
  var buildLines = document.getElementById('buildLines');
  var discBtns = Array.prototype.slice.call(document.querySelectorAll('.disc'));
  var layerBtns = Array.prototype.slice.call(document.querySelectorAll('.layer'));
  var buildBtns = Array.prototype.slice.call(document.querySelectorAll('.build'));

  /* ------------------------------------------------------------------
     DRAW the SVG overlays (discipline lines + output arrows).
     Recomputed on resize so geometry always matches the live layout.
  ------------------------------------------------------------------ */
  function isDesktop() { return window.innerWidth > 640; }

  function rel(el) {
    var s = scene.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height,
             cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2 };
  }

  function drawOverlays() {
    if (!isDesktop()) { discLines.innerHTML = ''; buildLines.innerHTML = ''; return; }
    var s = scene.getBoundingClientRect();
    discLines.setAttribute('viewBox', '0 0 ' + s.width + ' ' + s.height);
    buildLines.setAttribute('viewBox', '0 0 ' + s.width + ' ' + s.height);

    var m = rel(machine);
    var layerBoxes = layerBtns.map(rel);

    /* ---- discipline lines: one vertical spine on the rail side,
            a branch to EVERY layer, with a tick where it touches ---- */
    var dHtml = '';
    /* spine sits just left of the machine's left edge */
    var spineX = m.x - 14;
    var topY = layerBoxes[0].cy;
    var botY = layerBoxes[layerBoxes.length - 1].cy;
    dHtml += '<path d="M' + spineX + ' ' + topY + ' L' + spineX + ' ' + botY + '"/>';
    layerBoxes.forEach(function (lb) {
      var ex = m.x; /* touch the machine edge */
      dHtml += '<path d="M' + spineX + ' ' + lb.cy + ' L' + ex + ' ' + lb.cy + '"/>';
      dHtml += '<circle class="tick" cx="' + ex + '" cy="' + lb.cy + '" r="2.6"/>';
    });
    discLines.innerHTML = dHtml;

    /* ---- output arrows: from machine right edge OUT to each build ---- */
    var bHtml = '';
    buildBtns.forEach(function (btn, i) {
      var bb = rel(btn);
      var sx = m.x + m.w;            /* start at machine right edge */
      var sy = m.cy + (i - (buildBtns.length - 1) / 2) * (m.h / (buildBtns.length + 1));
      var ex = bb.x - 6;            /* arrowhead just before the chip */
      var ey = bb.cy;
      var midX = sx + (ex - sx) * 0.5;
      var d = 'M' + sx + ' ' + sy + ' C' + midX + ' ' + sy + ' ' + midX + ' ' + ey + ' ' + ex + ' ' + ey;
      var isFlow = (i === 0); /* one slow pulse travels the first arrow */
      bHtml += '<path class="' + (isFlow ? 'flow' + (reduceMotion ? '' : ' pulsing') : '') + '" data-arrow="' + btn.getAttribute('data-build') + '" d="' + d + '"/>';
      /* arrowhead */
      bHtml += '<polygon data-head="' + btn.getAttribute('data-build') + '" points="' +
               ex + ',' + ey + ' ' + (ex - 7) + ',' + (ey - 4) + ' ' + (ex - 7) + ',' + (ey + 4) + '"/>';
    });
    buildLines.innerHTML = bHtml;
  }

  /* throttle resize */
  var rT;
  function onResize() { clearTimeout(rT); rT = setTimeout(drawOverlays, 80); }
  window.addEventListener('resize', onResize);
  /* fonts can shift layout; redraw after load */
  window.addEventListener('load', drawOverlays);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(drawOverlays); }
  drawOverlays();

  /* ------------------------------------------------------------------
     DISCIPLINE hover -> light its line across ALL layers (violet)
  ------------------------------------------------------------------ */
  function litDisc(on) {
    discLines.classList.toggle('lit', on);
    machine.classList.toggle('lit', on);
  }
  discBtns.forEach(function (b) {
    b.addEventListener('mouseenter', function () { litDisc(true); b.classList.add('lit'); });
    b.addEventListener('mouseleave', function () { litDisc(false); b.classList.remove('lit'); });
    b.addEventListener('focus', function () { litDisc(true); b.classList.add('lit'); });
    b.addEventListener('blur', function () { litDisc(false); b.classList.remove('lit'); });
  });

  /* ------------------------------------------------------------------
     BUILD hover/click -> light which layers it draws from
  ------------------------------------------------------------------ */
  function litBuild(key, on) {
    var srcs = BUILD_SOURCES[key] || [];
    layerBtns.forEach(function (l) {
      var k = l.getAttribute('data-layer');
      l.classList.toggle('sourced', on && srcs.indexOf(k) !== -1);
    });
    /* light that arrow */
    var arrow = buildLines.querySelector('[data-arrow="' + key + '"]');
    var head = buildLines.querySelector('[data-head="' + key + '"]');
    if (arrow && !arrow.classList.contains('flow')) {
      arrow.style.stroke = on ? 'var(--accent)' : '';
      arrow.style.strokeWidth = on ? '2.2' : '';
    }
    if (head) head.style.fill = on ? 'var(--accent)' : '';
  }
  var activeBuild = null;
  buildBtns.forEach(function (b) {
    var key = b.getAttribute('data-build');
    b.addEventListener('mouseenter', function () { if (!activeBuild) litBuild(key, true); });
    b.addEventListener('mouseleave', function () { if (!activeBuild) litBuild(key, false); });
    b.addEventListener('click', function () {
      if (activeBuild === key) {
        litBuild(key, false); b.classList.remove('active'); activeBuild = null;
      } else {
        if (activeBuild) {
          litBuild(activeBuild, false);
          var prev = buildBtns.filter(function (x) { return x.getAttribute('data-build') === activeBuild; })[0];
          if (prev) prev.classList.remove('active');
        }
        litBuild(key, true); b.classList.add('active'); activeBuild = key;
      }
    });
  });

  /* ------------------------------------------------------------------
     LAYER click -> open drill-in sheet with that layer's patterns
  ------------------------------------------------------------------ */
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var sheetIco = document.getElementById('sheetIco');
  var sheetTitle = document.getElementById('sheetTitle');
  var sheetDesc = document.getElementById('sheetDesc');
  var sheetList = document.getElementById('sheetList');
  var sheetClose = document.getElementById('sheetClose');
  var lastFocus = null;

  function buildPatternRow(p) {
    if (p.href) {
      var a = document.createElement('a');
      a.className = 'pat link';
      a.href = p.href;
      a.innerHTML =
        '<span class="pat-dot"></span>' +
        '<span class="pat-body"><span class="pat-name">' + p.name +
          '<span class="open-tag">open &rarr;</span></span>' +
          '<span class="pat-sub">' + p.sub + '</span></span>' +
        '<span class="pat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      return a;
    }
    var div = document.createElement('div');
    div.className = 'pat';
    div.innerHTML =
      '<span class="pat-dot"></span>' +
      '<span class="pat-body"><span class="pat-name">' + p.name + '</span>' +
        '<span class="pat-sub">' + p.sub + '</span></span>';
    return div;
  }

  function openLayer(key) {
    var data = LAYERS[key];
    if (!data) return;
    lastFocus = document.activeElement;
    sheetIco.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (LAYER_ICON[key] || '') + '</svg>';
    sheetTitle.textContent = data.title;
    sheetDesc.textContent = data.desc;
    sheetList.innerHTML = '';
    data.patterns.forEach(function (p) { sheetList.appendChild(buildPatternRow(p)); });
    scrim.classList.add('open');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    sheetClose.focus();
  }
  function closeSheet() {
    scrim.classList.remove('open');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  layerBtns.forEach(function (l) {
    l.addEventListener('click', function () { openLayer(l.getAttribute('data-layer')); });
  });
  scrim.addEventListener('click', closeSheet);
  sheetClose.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

})();
</script>
</body>
</html>
