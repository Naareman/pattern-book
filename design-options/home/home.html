<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCFD; --surface:#FFFFFF; --text:#15171C; --soft:#565C68; --faint:#8A909C;
    --border:#E8EAEE; --border-strong:#D5D9E0; --accent:#7C5CF6; --accent-hover:#6D4DE6; --accent-soft:#F0ECFE;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 26px rgba(16,24,40,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:0 24px}

  header{padding:42px 0 8px}
  .wordmark{font-family:'Fraunces',serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
  .strap{color:var(--soft);font-size:15px;margin-top:4px}

  .stage{padding:34px 0 64px}
  .canvas{width:840px;max-width:100%;margin:0 auto}

  /* identical box treatment for all three */
  .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .box-head{display:flex;align-items:center;gap:8px;width:100%;padding:13px 16px;border:none;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;text-align:left}
  .box-head:hover{background:var(--accent-soft)}
  .box-head .name{font-family:'Fraunces',serif;font-weight:500;font-size:18px}
  .box-head .what{font-size:12.5px;color:var(--soft)}
  .box-head .open{margin-left:auto;color:var(--faint);font-size:14px}
  .box-head:hover .name{color:var(--accent-hover)} .box-head:hover .open{color:var(--accent)}

  .items{padding:8px}
  .item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid transparent;background:none;font-family:'Inter';font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:background .14s ease,border-color .14s ease}
  .item + .item{margin-top:3px}
  .item:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover)}
  .item .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-hover);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .item .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.55}
  .item .ico{flex:none;width:18px;height:18px;color:var(--accent);display:block}
  .item .ico svg{width:18px;height:18px;display:block}
  .item.more{color:var(--faint);font-weight:500}
  .item.more:hover{background:none;border-color:transparent;color:var(--accent)}
  /* interaction: a concern lights every layer; a build lights the layers it is made from */
  .layers .item.lit{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover);box-shadow:inset 0 0 0 1px var(--accent)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .layers .item{animation:rise .45s ease both}
  @media (prefers-reduced-motion:reduce){.layers .item{animation:none}}

  /* TOP: layers (with axis on the RIGHT) + builds output centered vertically */
  .top{display:grid;grid-template-columns:1fr 96px 210px;align-items:start;column-gap:0}
  .layers .body{display:grid;grid-template-columns:1fr 100px}
  /* direction arrow, on the right of the layer list */
  .axis{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 8px;text-align:center;border-left:1px solid var(--border)}
  .axis .cap{font-size:10.5px;color:var(--soft);line-height:1.25}
  .axis .cap b{display:block;color:var(--text);font-size:11.5px;font-weight:600;margin-bottom:1px}
  .axis .rail{flex:1;min-height:70px;width:2px;background:var(--accent);opacity:.4;margin:10px 0;position:relative;border-radius:2px}
  .axis .rail::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:8px solid var(--accent);opacity:.9}

  /* produces + builds, vertically centered against the layers box */
  .produces{align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:12px;gap:4px}
  .builds{align-self:center}

  /* across -> full-width concerns band, centered items */
  .across{display:flex;flex-direction:column;align-items:center;margin-top:16px;color:var(--faint);font-size:12px;gap:5px}
  .across .leg{width:1.5px;height:15px;background:var(--border-strong)}
  /* live neon flow on the connectors */
  .flow{position:relative;background:var(--accent);opacity:.4;border-radius:2px}
  .flow-x{width:46px;height:2px}
  .flow-x::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:7px solid var(--accent)}
  .flow-y{width:2px;height:15px}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px rgba(124,92,246,.75)}
  .flow-x .spark{top:50%;transform:translateY(-50%);animation:sparkX 1.8s linear infinite}
  .flow-y .spark{left:50%;transform:translateX(-50%);animation:sparkY 1.8s linear infinite}
  @keyframes sparkX{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
  @keyframes sparkY{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
  @media (prefers-reduced-motion:reduce){.spark{display:none}}
  .concerns{width:100%;margin-top:5px}
  .concerns .items{display:flex;flex-wrap:wrap;gap:9px;padding:16px;justify-content:center}
  .concerns .item{width:auto;border:1px solid var(--border-strong);border-radius:22px;padding:8px 16px}
  .concerns .item:hover{border-color:var(--accent)}

  .foot{border-top:1px solid var(--border);padding:20px 0;text-align:center;color:var(--faint);font-size:12px;margin-top:32px}
  .foot strong{color:var(--soft);font-weight:500}

  @media(max-width:720px){
    .canvas{width:100%}
    .top{grid-template-columns:1fr}
    .produces{flex-direction:row;padding:10px 0}
    .produces svg{transform:rotate(90deg)}
    .builds{width:100%}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="wordmark">The Pattern Book</div>
      <div class="strap">How AI systems are built, layer by layer.</div>
    </header>

    <div class="stage">
      <div class="canvas">
        <div class="top">
          <!-- LAYERS: numbered list, with direction arrow on the right -->
          <div class="box layers">
            <button class="box-head" data-go="layers"><span class="name">Layers</span><span class="what">what it's built from</span><span class="open">›</span></button>
            <div class="body">
              <div class="items">
                <button class="item" data-go="layer"><span class="num">1</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H4zM2 20h20M9.5 16v4M14.5 16v4"/></svg></span>User experience</button>
                <button class="item" data-go="layer"><span class="num">2</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>Application patterns</button>
                <button class="item" data-go="layer"><span class="num">3</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M10.5 7.5L7.5 16M13.5 7.5l3 8.5M8.5 18h7"/></svg></span>Orchestration &amp; agents</button>
                <button class="item" data-go="layer"><span class="num">4</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a7 7 0 1 0 7 7"/><path d="M12 5v4l3 2M19 5l-3 1 1-3"/></svg></span>Single-call control</button>
                <button class="item" data-go="layer"><span class="num">5</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></span>Knowledge &amp; memory</button>
                <button class="item" data-go="layer"><span class="num">6</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/></svg></span>Composition</button>
                <button class="item" data-go="layer"><span class="num">7</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7"/><path d="M3 19h18"/></svg></span>Training &amp; adaptation</button>
                <button class="item" data-go="layer"><span class="num">8</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg></span>Serving &amp; infrastructure</button>
                <button class="item" data-go="layer"><span class="num">9</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span>Data &amp; artifacts</button>
              </div>
              <div class="axis">
                <div class="cap"><b>User-facing</b>what people touch</div>
                <div class="rail"></div>
                <div class="cap"><b>Foundation</b>what it rests on</div>
              </div>
            </div>
          </div>

          <!-- produces (centered, next to builds) -->
          <div class="produces">
            <div class="flow flow-x"><span class="spark"></span></div>
            <span>produces</span>
          </div>

          <!-- BUILDS output (centered vertically) -->
          <div class="box builds">
            <button class="box-head" data-go="builds"><span class="name">Builds</span><span class="what">what it produces</span><span class="open">›</span></button>
            <div class="items">
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg></span>Coding Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg></span>Document Q&amp;A</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg></span>Research Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-3.2 6.9L21 20z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg></span>Customer Support Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Voice Assistant</button>
              <button class="item more" data-go="builds">… and more</button>
            </div>
          </div>
        </div>

        <!-- across -> full-width concerns band -->
        <div class="across"><div class="flow flow-y"><span class="spark"></span></div>across<div class="flow flow-y"><span class="spark"></span></div></div>
        <div class="box concerns">
          <button class="box-head" data-go="concerns"><span class="name">Concerns</span><span class="what">what every layer must get right</span><span class="open">›</span></button>
          <div class="items">
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-3"/><circle cx="12" cy="13" r="1.3" fill="currentColor" stroke="none"/></svg></span>Evaluation</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></span>Safety</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>Privacy</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg></span>Observability</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2c0-1.2 1.1-1.7 2.5-1.7s2.5.6 2.5 1.9c0 2.6-5 1.4-5 4 0 1.3 1.1 2 2.5 2s2.5-.5 2.5-1.7"/></svg></span>Cost</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-4-9 7"/></svg></span>Multimodal</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>Real-time</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="foot"><strong>The Pattern Book</strong> &nbsp;&middot;&nbsp; An interactive reference for the patterns behind modern AI systems.</footer>
  </div>

<script>
  const layerItems = Array.from(document.querySelectorAll('.layers .item'));
  layerItems.forEach((el,i)=>{ el.style.animationDelay = (i*45) + 'ms'; });

  let selected = null; // 'all' (a concern) | array of layer numbers (a build) | null
  function paint(set){ layerItems.forEach((el,i)=> el.classList.toggle('lit', set!=null && (set==='all' || set.indexOf(i+1)>-1))); }
  function apply(){ paint(selected); }

  // works on both mouse (hover previews) and touch (tap toggles, stays lit)
  function wire(el, set){
    el.addEventListener('mouseenter', ()=> paint(set));
    el.addEventListener('mouseleave', apply);
    el.addEventListener('click', ()=>{ selected = (selected === set) ? null : set; apply(); });
  }
  document.querySelectorAll('.concerns .item').forEach(c=> wire(c, 'all'));
  const buildLayers = [[3,4,5],[2,4,5],[3,4,5],[1,3,5,6],[1,4,8]];
  Array.from(document.querySelectorAll('.builds .item')).filter(b=> !b.classList.contains('more')).forEach((b,i)=> wire(b, buildLayers[i] || []));

  // placeholder navigation (each routes to its own page once built)
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',()=> console.log('open', el.dataset.go, el.textContent.trim()));
  });
</script>
</body>
</html>
