<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCFD; --surface:#FFFFFF; --text:#15171C; --soft:#565C68; --faint:#6B7280;
    --border:#E8EAEE; --border-strong:#D5D9E0; --accent:#7C5CF6; --accent-hover:#6D4DE6; --accent-soft:#F0ECFE;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 26px rgba(16,24,40,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:0 24px}

  header{padding:26px 0 6px}
  .wordmark{font-family:'Fraunces',serif;font-weight:500;font-size:25px;letter-spacing:-.01em}
  .strap{color:var(--soft);font-size:15px;margin-top:4px}

  .stage{padding:20px 0 22px}
  .canvas{width:840px;max-width:100%;margin:0 auto}

  .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:border-color .25s ease,box-shadow .25s ease}
  /* header: a clickable title link + a play button on the same line */
  .box-head{display:flex;align-items:center;border-bottom:1px solid var(--border);background:#fff}
  .head-link{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:13px 16px;border:none;background:none;cursor:pointer;text-align:left}
  .head-link:hover{background:var(--accent-soft)}
  .head-link .name{font-family:'Fraunces',serif;font-weight:500;font-size:18px}
  .head-link .what{font-size:12.5px;color:var(--soft)}
  .head-link .open{margin-left:auto;color:var(--faint);font-size:14px}
  .head-link:hover .name{color:var(--accent-hover)} .head-link:hover .open{color:var(--accent)}
  .head-play{flex:none;margin:0 12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border-strong);background:#fff;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .14s ease,border-color .14s ease}
  .head-play:hover{background:var(--accent-soft);border-color:var(--accent)}
  .head-play svg{width:11px;height:11px;display:block;margin-left:1px}

  .items{padding:8px}
  .item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid transparent;background:none;font-family:'Inter';font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:background .25s ease,border-color .25s ease,opacity .5s ease,transform .5s ease}
  .item + .item{margin-top:3px}
  .item:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover)}
  .item .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-hover);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .item .ico{flex:none;width:18px;height:18px;color:var(--accent);display:block}
  .item .ico svg{width:18px;height:18px;display:block}
  .item.more{color:var(--faint);font-weight:500}
  .item.more:hover{background:none;border-color:transparent;color:var(--accent)}
  .layers .item.lit{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover);box-shadow:inset 0 0 0 1px var(--accent)}
  .layers .item.dim{opacity:0;transform:translateY(10px)}
  .builds .item.demo{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover)}
  /* per-layer importance meter for a selected concern (hidden until a concern is active) */
  .item .meter{margin-left:auto;flex:none;width:48px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;opacity:0;transition:opacity .3s ease}
  .item .meter > i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s ease}
  .box.layers.show-meters .item .meter{opacity:1}
  .concerns .item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hover)}

  .top{display:grid;grid-template-columns:1fr 96px 210px;align-items:start;column-gap:0}
  .layers .body{display:grid;grid-template-columns:1fr 100px}
  /* direction arrow: points UP (foundation -> user-facing); grows when you build the stack */
  .axis{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 8px;text-align:center;border-left:1px solid var(--border)}
  .axis .cap{font-size:10.5px;color:var(--soft);line-height:1.25}
  .axis .cap b{display:block;color:var(--text);font-size:11.5px;font-weight:600;margin-bottom:1px}
  .axis .rail{flex:1;min-height:70px;width:4px;background:var(--accent);opacity:.75;margin:10px 0;position:relative;border-radius:3px;transform-origin:bottom center}
  .axis .rail::after{content:"";position:absolute;top:-3px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--accent)}

  /* produces -> builds (an output, so a directional flow + spark is right) */
  .produces{align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:12px;gap:4px}
  .builds{align-self:center}
  .flow{position:relative;background:var(--accent);opacity:.4;border-radius:2px}
  .flow-x{width:46px;height:2px}
  .flow-x::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:7px solid var(--accent)}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px rgba(124,92,246,.75)}
  .flow-x .spark{top:50%;transform:translateY(-50%);animation:sparkX 2.6s linear infinite}
  @keyframes sparkX{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}

  /* across: a bracket spanning the whole Layers box, pointing down to Concerns, with a neon spark */
  .across{position:relative;width:64%;margin:14px auto 0;height:36px}
  .across .bar{position:absolute;top:0;left:0;right:0;height:1.5px;background:var(--border-strong);border-radius:2px}
  .across .bar::before,.across .bar::after{content:"";position:absolute;top:0;width:1.5px;height:7px;background:var(--border-strong)}
  .across .bar::before{left:0}.across .bar::after{right:0}
  .across .stem{position:absolute;left:50%;top:0;transform:translateX(-50%);width:1.5px;height:36px;background:var(--border-strong)}
  .across .spark{position:absolute;left:50%;margin-left:-3px;animation:sparkDown 2.4s linear infinite}
  @keyframes sparkDown{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:36px;opacity:0}}
  @media (prefers-reduced-motion:reduce){.spark{display:none}}

  .concerns{width:100%;margin-top:2px}
  .concerns.pulse{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  .concerns .items{display:flex;flex-wrap:wrap;gap:9px;padding:16px;justify-content:center}
  .concerns .item{width:auto;border:1px solid var(--border-strong);border-radius:22px;padding:8px 16px}
  .concerns .item:hover{border-color:var(--accent)}
  .concerns .item .meter{display:none}

  .foot{border-top:1px solid var(--border);padding:16px 0;text-align:center;color:var(--faint);font-size:12px;margin-top:18px}
  .foot strong{color:var(--soft);font-weight:500}

  @media(max-width:720px){
    .canvas{width:100%}
    .top{grid-template-columns:1fr}
    .produces{flex-direction:row;padding:10px 0}
    .builds{width:100%}
    .across{width:80%}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="wordmark">The Pattern Book</div>
      <div class="strap">How AI systems are built, layer by layer.</div>
    </header>

    <div class="stage">
      <div class="canvas">
        <div class="top">
          <!-- LAYERS: numbered BOTTOM-UP, arrow points up (foundation -> user-facing), play in the header -->
          <div class="box layers">
            <div class="box-head">
              <button class="head-link" data-go="layers"><span class="name">Layers</span><span class="what">what it's built from</span><span class="open">›</span></button>
              <button class="head-play" data-play="stack" type="button" aria-label="Watch the stack build, foundation to user-facing"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
            <div class="body">
              <div class="items">
                <button class="item" data-go="layer"><span class="num">9</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H4zM2 20h20M9.5 16v4M14.5 16v4"/></svg></span>User experience</button>
                <button class="item" data-go="layer"><span class="num">8</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>Application patterns</button>
                <button class="item" data-go="layer"><span class="num">7</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M10.5 7.5L7.5 16M13.5 7.5l3 8.5M8.5 18h7"/></svg></span>Orchestration &amp; agents</button>
                <button class="item" data-go="layer"><span class="num">6</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a7 7 0 1 0 7 7"/><path d="M12 5v4l3 2M19 5l-3 1 1-3"/></svg></span>Single-call control</button>
                <button class="item" data-go="layer"><span class="num">5</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg></span>Knowledge &amp; memory</button>
                <button class="item" data-go="layer"><span class="num">4</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/></svg></span>Composition</button>
                <button class="item" data-go="layer"><span class="num">3</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7"/><path d="M3 19h18"/></svg></span>Training &amp; adaptation</button>
                <button class="item" data-go="layer"><span class="num">2</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg></span>Serving &amp; infrastructure</button>
                <button class="item" data-go="layer"><span class="num">1</span><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span>Data &amp; artifacts</button>
              </div>
              <div class="axis">
                <div class="cap"><b>User-facing</b>what people touch</div>
                <div class="rail"></div>
                <div class="cap"><b>Foundation</b>what it rests on</div>
              </div>
            </div>
          </div>

          <div class="produces">
            <div class="flow flow-x"><span class="spark"></span></div>
            <span>produces</span>
          </div>

          <div class="box builds">
            <div class="box-head">
              <button class="head-link" data-go="builds"><span class="name">Builds</span><span class="what">what it produces</span><span class="open">›</span></button>
              <button class="head-play" data-play="connect" type="button" aria-label="Watch how a build connects to layers"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
            <div class="items">
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg></span>Coding Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg></span>Document Q&amp;A</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg></span>Research Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-3.2 6.9L21 20z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg></span>Customer Support Agent</button>
              <button class="item" data-go="build"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Voice Assistant</button>
              <button class="item more" data-go="builds">… and more</button>
            </div>
          </div>
        </div>

        <!-- bracket spanning the Layers box, pointing down to Concerns (neon spark) -->
        <div class="across"><div class="bar"></div><div class="stem"></div><span class="spark"></span></div>

        <div class="box concerns">
          <div class="box-head">
            <button class="head-link" data-go="concerns"><span class="name">Concerns</span><span class="what">what every layer must get right</span><span class="open">›</span></button>
            <button class="head-play" data-play="concern" type="button" aria-label="Watch how a concern weighs on each layer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          </div>
          <div class="items">
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-3"/><circle cx="12" cy="13" r="1.3" fill="currentColor" stroke="none"/></svg></span>Evaluation</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></span>Safety</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>Privacy</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg></span>Observability</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2c0-1.2 1.1-1.7 2.5-1.7s2.5.6 2.5 1.9c0 2.6-5 1.4-5 4 0 1.3 1.1 2 2.5 2s2.5-.5 2.5-1.7"/></svg></span>Cost</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-4-9 7"/></svg></span>Multimodal</button>
            <button class="item" data-go="concern"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>Real-time</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="foot"><strong>The Pattern Book</strong> &nbsp;&middot;&nbsp; An interactive reference for the patterns behind modern AI systems.</footer>
  </div>

<script>
  const layerItems = Array.from(document.querySelectorAll('.layers .item'));   // 0 = top (User experience) ... 8 = bottom (Data & artifacts)
  const buildItems = Array.from(document.querySelectorAll('.builds .item')).filter(b=> !b.classList.contains('more'));
  const concernItems = Array.from(document.querySelectorAll('.concerns .item'));
  const concernsBox = document.querySelector('.box.concerns');
  const layersBox = document.querySelector('.box.layers');
  const rail = document.querySelector('.axis .rail');

  // inject a small importance meter into each layer row (hidden until a concern is active)
  layerItems.forEach(el=>{ const m=document.createElement('span'); m.className='meter'; m.innerHTML='<i></i>'; el.appendChild(m); });
  const meters = layerItems.map(el=> el.querySelector('.meter > i'));

  let timers = [];
  const wait = (ms, fn)=> timers.push(setTimeout(fn, ms));
  const stop = ()=>{ timers.forEach(clearTimeout); timers = []; };
  let activeConcern = null;
  function clearAll(){
    layerItems.forEach(el=> el.classList.remove('lit','dim'));
    buildItems.forEach(el=> el.classList.remove('demo'));
    concernItems.forEach(c=> c.classList.remove('active'));
    concernsBox.classList.remove('pulse');
    layersBox.classList.remove('show-meters');
    meters.forEach(m=> m.style.width='0');
    rail.style.transition='transform .3s ease'; rail.style.transform='scaleY(1)';
    activeConcern = null;
  }

  // PLAY 1: build the stack, foundation up, and draw the foundation->user arrow as it goes
  function buildStack(){
    stop(); clearAll();
    layerItems.forEach(el=> el.classList.add('dim'));
    rail.style.transition='none'; rail.style.transform='scaleY(0)'; rail.getBoundingClientRect();
    const total = 200 + layerItems.length*180;
    rail.style.transition='transform '+(total/1000)+'s ease'; rail.style.transform='scaleY(1)';
    let t = 200;
    for(let i = layerItems.length - 1; i >= 0; i--){ wait(t, ()=> layerItems[i].classList.remove('dim')); t += 180; }
  }

  // PLAY 2: a concern, overall (applies to every layer) then drilled into per-layer importance
  const importance = {
    'Evaluation':[1,2,2,3,2,3,3,1,2], 'Safety':[3,3,2,3,2,1,2,1,2], 'Privacy':[2,2,1,1,3,1,2,2,3],
    'Observability':[1,1,3,1,1,2,1,3,2], 'Cost':[1,1,2,2,2,2,3,3,1], 'Multimodal':[2,2,1,2,2,1,2,1,1], 'Real-time':[2,1,2,1,1,1,1,3,1]
  };
  function showConcern(name, chip){
    stop(); clearAll();
    const v = importance[name]; if(!v) return;
    activeConcern = name; if(chip) chip.classList.add('active'); concernsBox.classList.add('pulse');
    // overall: it touches EVERY layer
    layerItems.forEach(el=> el.classList.add('lit'));
    // then drill into how much it weighs per layer
    wait(1200, ()=>{
      layerItems.forEach(el=> el.classList.remove('lit'));
      layersBox.classList.add('show-meters');
      meters.forEach((m,i)=> m.style.width = ((v[i]||0)/3*100)+'%');
    });
  }
  function concernDemo(){ const c = concernItems.find(x=> x.textContent.trim()==='Cost'); showConcern('Cost', c); }

  // PLAY 3: how a build connects — first two builds only, a bit faster
  function connect(){
    stop(); clearAll();
    const A=[2,3,4], B=[0,4,8];
    buildItems[0].classList.add('demo'); A.forEach(i=> layerItems[i].classList.add('lit'));
    wait(1400, ()=>{ buildItems[0].classList.remove('demo'); A.forEach(i=> layerItems[i].classList.remove('lit')); });
    wait(1700, ()=>{ buildItems[1].classList.add('demo'); B.forEach(i=> layerItems[i].classList.add('lit')); });
    wait(3100, ()=>{ buildItems[1].classList.remove('demo'); B.forEach(i=> layerItems[i].classList.remove('lit')); });
  }

  document.querySelectorAll('.head-play').forEach(b=>{
    b.addEventListener('click',()=>{ const p=b.dataset.play; if(p==='stack')buildStack(); else if(p==='connect')connect(); else if(p==='concern')concernDemo(); });
  });
  // click a concern chip -> its per-layer importance (toggle)
  concernItems.forEach(c=>{
    const name = c.textContent.trim();
    c.addEventListener('click',()=>{ if(activeConcern===name){ clearAll(); } else { showConcern(name, c); } });
  });
  // click a title / layer / build -> navigate to its page (placeholder)
  document.querySelectorAll('.head-link[data-go], .layers .item[data-go], .builds .item[data-go]').forEach(el=>{
    el.addEventListener('click',()=> console.log('navigate ->', el.dataset.go, el.textContent.trim()));
  });
</script>
</body>
</html>
