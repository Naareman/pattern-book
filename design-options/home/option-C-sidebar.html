<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pattern Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCFD; --bg-subtle:#F6F7F9; --surface:#FFFFFF;
    --text:#15171C; --text-soft:#565C68; --text-faint:#8A909C;
    --border:#E8EAEE; --border-strong:#D5D9E0;
    --accent:#7C5CF6; --accent-hover:#6D4DE6; --accent-soft:#F0ECFE;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(21,23,28,.04), 0 1px 3px rgba(21,23,28,.04);
    --shadow-md:0 4px 16px rgba(21,23,28,.06), 0 1px 4px rgba(21,23,28,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    font-size:15px;
  }

  /* ---------- Hero ---------- */
  .hero{
    border-bottom:1px solid var(--border);
    background:var(--surface);
    padding:34px 32px 30px;
  }
  .hero-inner{max-width:1140px;margin:0 auto}
  .hero h1{
    font-family:'Fraunces',serif; font-weight:500;
    font-size:34px; letter-spacing:-.01em; line-height:1.1;
    color:var(--text);
  }
  .hero p{
    margin-top:10px; color:var(--text-soft);
    font-size:16px; max-width:560px;
  }

  /* ---------- Layout ---------- */
  .layout{
    max-width:1140px; margin:0 auto; padding:28px 32px 64px;
    display:grid; grid-template-columns:228px 1fr; gap:36px;
    align-items:start;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{position:sticky; top:24px}
  .sidebar-label{
    font-size:11px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--text-faint);
    padding:0 10px 8px;
  }
  .nav{list-style:none; display:flex; flex-direction:column; gap:2px}
  .nav a{
    display:flex; align-items:center; justify-content:space-between;
    text-decoration:none; color:var(--text-soft);
    font-size:14px; font-weight:500;
    padding:8px 10px; border-radius:9px;
    transition:background .15s, color .15s;
  }
  .nav a .count{
    font-size:12px; color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }
  .nav a:hover{background:var(--bg-subtle); color:var(--text)}
  .nav a.active{background:var(--accent-soft); color:var(--accent-hover)}
  .nav a.active .count{color:var(--accent)}

  /* ---------- Main ---------- */
  .main{min-width:0}
  .cat{margin-bottom:38px; scroll-margin-top:24px}
  .cat:last-child{margin-bottom:0}
  .cat-head{
    display:flex; align-items:baseline; gap:10px;
    padding-bottom:12px; margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .cat-head h2{
    font-size:17px; font-weight:600; letter-spacing:-.01em;
  }
  .cat-head .tag{
    font-size:12px; color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }

  .rows{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .row{
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    color:inherit; text-decoration:none;
    transition:background .14s;
  }
  .row:last-child{border-bottom:none}
  a.row{cursor:pointer}
  a.row:hover{background:var(--bg-subtle)}
  div.row{cursor:default}

  .row-body{min-width:0; flex:1}
  .row-name{
    font-size:14.5px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .row-desc{
    font-size:13px; color:var(--text-soft);
    margin-top:2px;
  }
  .soon{
    font-size:10.5px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:var(--text-faint);
    background:var(--bg-subtle); border:1px solid var(--border);
    padding:1px 7px; border-radius:99px; line-height:1.6;
  }
  .arrow{
    color:var(--text-faint); flex-shrink:0;
    transition:transform .14s, color .14s;
  }
  a.row:hover .arrow{transform:translateX(2px); color:var(--accent)}

  /* ---------- Mobile chip nav ---------- */
  .chip-nav{display:none}

  @media (max-width:760px){
    .hero{padding:26px 18px 22px}
    .hero h1{font-size:28px}
    .hero p{font-size:15px}
    .layout{
      grid-template-columns:1fr; gap:0; padding:0 0 56px;
    }
    .sidebar{display:none}
    .chip-nav{
      display:block; position:sticky; top:0; z-index:20;
      background:rgba(252,252,253,.92); backdrop-filter:blur(8px);
      border-bottom:1px solid var(--border);
      padding:12px 0;
    }
    .chips{
      display:flex; gap:8px; overflow-x:auto;
      padding:0 18px; scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex-shrink:0; white-space:nowrap;
      font-size:13px; font-weight:500;
      color:var(--text-soft); text-decoration:none;
      padding:7px 14px; border-radius:99px;
      border:1px solid var(--border); background:var(--surface);
      transition:all .14s;
    }
    .chip.active{
      background:var(--accent-soft); color:var(--accent-hover);
      border-color:var(--accent-soft);
    }
    .main{padding:22px 18px 0}
    .cat{scroll-margin-top:64px}
    .row{padding:13px 15px}
  }
  @media (max-width:380px){
    .hero{padding:22px 14px 20px}
    .chips{padding:0 14px}
    .main{padding:20px 14px 0}
    .row{padding:12px 13px}
    .row-name{font-size:14px}
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <h1>The Pattern Book</h1>
      <p>An interactive reference for the patterns behind modern AI systems.</p>
    </div>
  </header>

  <!-- Mobile chip nav -->
  <nav class="chip-nav" aria-label="Categories">
    <div class="chips" id="chips"></div>
  </nav>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-label">Categories</div>
      <ul class="nav" id="nav"></ul>
    </aside>

    <!-- Main -->
    <main class="main" id="main"></main>
  </div>

<script>
  const data = [
    {
      id:"retrieval", name:"Retrieval & Knowledge",
      patterns:[
        {name:"RAG", desc:"Ground answers in retrieved documents.", href:"../../example/rag.html"},
        {name:"Tool Use", desc:"Let the model call external functions and APIs."},
        {name:"Reranking", desc:"Reorder retrieved results by relevance."},
        {name:"Hybrid Search", desc:"Blend keyword and vector search."}
      ]
    },
    {
      id:"reasoning", name:"Reasoning & Prompting",
      patterns:[
        {name:"Chain-of-Thought", desc:"Make the model reason step by step.", href:"../../patterns/L4-chain-of-thought.html"},
        {name:"Few-Shot", desc:"Steer behaviour with a handful of examples."},
        {name:"Self-Consistency", desc:"Sample multiple paths and vote."},
        {name:"Structured Output", desc:"Constrain responses to a fixed schema."}
      ]
    },
    {
      id:"evaluation", name:"Evaluation & Verification",
      patterns:[
        {name:"LLM-as-Judge", desc:"Use a model to score model outputs."},
        {name:"Reflection", desc:"Have the model critique and revise itself."}
      ]
    },
    {
      id:"orchestration", name:"Orchestration & Agents",
      patterns:[
        {name:"ReAct", desc:"Interleave reasoning with actions."},
        {name:"Reflexion", desc:"Learn from feedback across attempts."},
        {name:"Planner & Executor", desc:"Separate planning from execution."},
        {name:"Router & Cascade", desc:"Route requests to the right model or path."}
      ]
    },
    {
      id:"memory", name:"Memory",
      patterns:[
        {name:"Long-Term Memory", desc:"Persist and recall context over time."}
      ]
    },
    {
      id:"builds", name:"Builds",
      patterns:[
        {name:"Document Q&A", desc:"Answer questions over your documents."},
        {name:"Coding Agent", desc:"Read, write, and run code autonomously."},
        {name:"Research Agent", desc:"Gather and synthesise information."},
        {name:"Customer Support Agent", desc:"Resolve user requests end to end."},
        {name:"Conversational Assistant", desc:"Hold context-aware dialogue."}
      ]
    }
  ];

  // Build sidebar + chips
  const nav = document.getElementById('nav');
  const chips = document.getElementById('chips');
  const main = document.getElementById('main');

  data.forEach(cat=>{
    // sidebar item
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${cat.id}" data-id="${cat.id}">
        <span>${cat.name}</span>
        <span class="count">${cat.patterns.length}</span>
      </a>`;
    nav.appendChild(li);

    // chip
    const chip = document.createElement('a');
    chip.href = `#${cat.id}`;
    chip.className = 'chip';
    chip.dataset.id = cat.id;
    chip.textContent = cat.name;
    chips.appendChild(chip);

    // main section
    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.id = cat.id;
    const rows = cat.patterns.map(p=>{
      const inner = `
        <div class="row-body">
          <div class="row-name">${p.name}${p.href?'':'<span class="soon">soon</span>'}</div>
          <div class="row-desc">${p.desc}</div>
        </div>
        ${p.href?'<svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}`;
      return p.href
        ? `<a class="row" href="${p.href}">${inner}</a>`
        : `<div class="row">${inner}</div>`;
    }).join('');
    sec.innerHTML = `
      <div class="cat-head">
        <h2>${cat.name}</h2>
        <span class="tag">${cat.patterns.length} ${cat.patterns.length===1?'pattern':'patterns'}</span>
      </div>
      <div class="rows">${rows}</div>`;
    main.appendChild(sec);
  });

  // Active-state on scroll (scrollspy)
  const links = [...document.querySelectorAll('[data-id]')];
  const sections = data.map(c=>document.getElementById(c.id));

  function setActive(id){
    links.forEach(l=>l.classList.toggle('active', l.dataset.id===id));
    // keep active chip in view
    const chip = chips.querySelector(`.chip[data-id="${id}"]`);
    if(chip) chip.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  }

  const observer = new IntersectionObserver((entries)=>{
    const visible = entries.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(visible[0]) setActive(visible[0].target.id);
  },{rootMargin:'-20% 0px -70% 0px', threshold:0});
  sections.forEach(s=>observer.observe(s));

  setActive(data[0].id);
</script>
</body>
</html>
